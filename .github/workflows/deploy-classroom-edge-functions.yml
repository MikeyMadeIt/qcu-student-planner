name: Deploy Google Classroom Edge Functions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-classroom-functions:
    runs-on: ubuntu-latest
    env:
      EXPECTED_BRANCH: dev/mikey
      EXPECTED_PROJECT_REF: pjafmgabajqqozdxhzvz
      SUPABASE_CLI_VERSION: 3.2.0

    steps:
      - name: Check out dispatched revision
        uses: actions/checkout@v4

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.2.0

      - name: Verify deployment target and scope
        id: preflight
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" != "refs/heads/${EXPECTED_BRANCH}" ]]; then
            echo "Refusing deployment: dispatch this workflow from ${EXPECTED_BRANCH}." >&2
            exit 1
          fi

          if [[ "${EXPECTED_PROJECT_REF}" != "pjafmgabajqqozdxhzvz" ]]; then
            echo "Refusing deployment: configured project reference is not the approved target." >&2
            exit 1
          fi

          if [[ -z "${SUPABASE_ACCESS_TOKEN}" ]]; then
            echo "Missing required repository secret: SUPABASE_ACCESS_TOKEN" >&2
            exit 1
          fi

          functions=(
            classroom-oauth-start
            classroom-oauth-callback
            classroom-connection
          )
          for function in "${functions[@]}"; do
            if [[ ! -f "supabase/functions/${function}/index.ts" ]]; then
              echo "Missing expected function entrypoint: ${function}" >&2
              exit 1
            fi
          done

          echo "Branch: ${GITHUB_REF_NAME}"
          echo "Commit: $(git rev-parse HEAD)"
          echo "Project ref: ${EXPECTED_PROJECT_REF}"
          echo "Supabase CLI: $(supabase --version)"
          echo "Function deployment allowlist: ${functions[*]}"

      - name: Deploy classroom-oauth-start
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase functions deploy classroom-oauth-start \
            --project-ref pjafmgabajqqozdxhzvz \
            --yes

      - name: Deploy classroom-oauth-callback
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase functions deploy classroom-oauth-callback \
            --project-ref pjafmgabajqqozdxhzvz \
            --yes

      - name: Deploy classroom-connection
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase functions deploy classroom-connection \
            --project-ref pjafmgabajqqozdxhzvz \
            --yes

      - name: Write deployment summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
        run: |
          {
            echo '## Google Classroom Edge Function deployment'
            echo ''
            echo "- Result: ${JOB_STATUS}"
            echo "- Preflight: ${PREFLIGHT_OUTCOME}"
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo '- Project ref: pjafmgabajqqozdxhzvz'
            echo '- Supabase CLI: 3.2.0'
            echo '- Functions: classroom-oauth-start, classroom-oauth-callback, classroom-connection'
            echo '- Scope: Edge Functions only; no migrations, secrets, other functions, or frontend deployment.'
          } >> "${GITHUB_STEP_SUMMARY}"
