name: Supabase Classroom Staging Preflight

on:
  push:
    branches:
      - dev/mikey
    paths:
      - .github/workflows/supabase-classroom-preflight.yml

permissions:
  contents: read

jobs:
  staging-preflight:
    if: github.ref == 'refs/heads/dev/mikey'
    runs-on: ubuntu-latest
    env:
      EXPECTED_PROJECT_REF: pjafmgabajqqozdxhzvz

    steps:
      - name: Check out dev/mikey
        uses: actions/checkout@v4

      - name: Print run identity
        shell: bash
        run: |
          set -euo pipefail
          echo "Branch: ${GITHUB_REF_NAME}"
          echo "Commit: $(git rev-parse HEAD)"

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.2.0

      - name: Print CLI version
        run: supabase --version

      - name: Require staging credentials
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ACCESS_TOKEN}" ]]; then
            echo "Missing required repository secret: SUPABASE_ACCESS_TOKEN" >&2
            exit 1
          fi
          if [[ -z "${SUPABASE_DB_PASSWORD}" ]]; then
            echo "Missing required repository secret: SUPABASE_DB_PASSWORD" >&2
            exit 1
          fi
          if [[ -z "${SUPABASE_DB_URL}" ]]; then
            echo "Missing required repository secret: SUPABASE_DB_URL" >&2
            exit 1
          fi

      - name: Validate staging pooler URL
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const raw = process.env.SUPABASE_DB_URL;
          let url;
          try {
            url = new URL(raw);
          } catch {
            console.error('SUPABASE_DB_URL is not a valid database URL.');
            process.exit(1);
          }

          const validScheme = ['postgres:', 'postgresql:'].includes(url.protocol);
          const valid = validScheme &&
            url.hostname === 'aws-0-ap-south-1.pooler.supabase.com' &&
            url.port === '5432' &&
            url.username === 'postgres.pjafmgabajqqozdxhzvz' &&
            url.pathname === '/postgres' &&
            Boolean(url.password) &&
            !url.search && !url.hash;

          if (!valid) {
            console.error('SUPABASE_DB_URL does not match the required staging pooler configuration.');
            process.exit(1);
          }
          console.log('Staging pooler URL validation passed.');
          NODE

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Link only the confirmed staging project
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == "refs/heads/dev/mikey" ]] || {
            echo "Refusing to run outside dev/mikey." >&2
            exit 1
          }
          supabase link \
            --project-ref "${EXPECTED_PROJECT_REF}"

          linked_ref="$(cat supabase/.temp/project-ref)"
          echo "Linked project ref: ${linked_ref}"
          if [[ "${linked_ref}" != "${EXPECTED_PROJECT_REF}" ]]; then
            echo "Linked project reference does not match the expected staging project." >&2
            exit 1
          fi

      - name: Add staging target to workflow summary
        shell: bash
        run: |
          {
            echo '## QCU Student Planner — Supabase staging preflight'
            echo ''
            echo "- Project: QCU Student Planner staging"
            echo "- Project ref: ${EXPECTED_PROJECT_REF}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Inspect staging database read-only
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          PGOPTIONS='-c default_transaction_read_only=on' psql \
            --dbname "$SUPABASE_DB_URL" \
            --no-psqlrc \
            --set=ON_ERROR_STOP=1 \
            --no-align \
            --tuples-only \
            --field-separator=' | ' \
            --pset=pager=off <<'SQL'
          \echo '=== Google Classroom OAuth database security summary ==='
          \echo 'Migration history'
          select to_regclass('supabase_migrations.schema_migrations') is not null as migration_table_exists \gset
          \if :migration_table_exists
            select format('history table present; versions=%s; latest=%s',
                          count(*), coalesce(max(version)::text, 'none'))
              from supabase_migrations.schema_migrations;
          \else
          \echo 'ALERT: supabase_migrations.schema_migrations is missing'
          \endif

          \echo 'Classroom table definitions: columns, constraints, indexes'
          with expected(schema_name, table_name) as (
            values ('public', 'classroom_connections'),
                   ('private', 'classroom_oauth_transactions')
          )
          select format('%I.%I | columns=[%s] | constraints=[%s] | indexes=[%s]',
                 e.schema_name, e.table_name,
                 coalesce((
                   select string_agg(format('%I %s%s%s%s%s', a.attname,
                     pg_catalog.format_type(a.atttypid, a.atttypmod),
                     case when a.attnotnull then ' NOT NULL' else ' NULL' end,
                     case when d.adbin is not null
                       then ' DEFAULT ' || pg_catalog.pg_get_expr(d.adbin, d.adrelid)
                       else '' end,
                     case when a.attidentity <> '' then ' IDENTITY ' || a.attidentity else '' end,
                     case when a.attgenerated <> '' then ' GENERATED ' || a.attgenerated else '' end
                   ), '; ' order by a.attnum)
                     from pg_catalog.pg_attribute a
                     join pg_catalog.pg_class tc on tc.oid = a.attrelid
                     join pg_catalog.pg_namespace tn on tn.oid = tc.relnamespace
                     left join pg_catalog.pg_attrdef d on d.adrelid = a.attrelid and d.adnum = a.attnum
                    where tn.nspname = e.schema_name and tc.relname = e.table_name
                      and a.attnum > 0 and not a.attisdropped
                 ), 'MISSING'),
                 coalesce((
                   select string_agg(format('%s: %s', con.conname,
                     pg_catalog.pg_get_constraintdef(con.oid, true)), '; ' order by con.conname)
                     from pg_catalog.pg_constraint con
                     join pg_catalog.pg_class tc on tc.oid = con.conrelid
                     join pg_catalog.pg_namespace tn on tn.oid = tc.relnamespace
                    where tn.nspname = e.schema_name and tc.relname = e.table_name
                 ), 'none'),
                 coalesce((
                   select string_agg(format('%s: %s', ix.relname,
                     pg_catalog.pg_get_indexdef(i.indexrelid)), '; ' order by ix.relname)
                     from pg_catalog.pg_index i
                     join pg_catalog.pg_class tc on tc.oid = i.indrelid
                     join pg_catalog.pg_namespace tn on tn.oid = tc.relnamespace
                     join pg_catalog.pg_class ix on ix.oid = i.indexrelid
                    where tn.nspname = e.schema_name and tc.relname = e.table_name
                 ), 'none'))
            from expected e;

          \echo 'profiles.account_status prerequisite'
          select case when exists (
                   select 1 from pg_catalog.pg_attribute a
                   join pg_catalog.pg_class c on c.oid = a.attrelid
                   join pg_catalog.pg_namespace n on n.oid = c.relnamespace
                   where n.nspname = 'public' and c.relname = 'profiles'
                     and a.attname = 'account_status' and a.attnum > 0 and not a.attisdropped
                 ) then 'public.profiles.account_status: present'
                 else 'ALERT: public.profiles.account_status is missing' end;

          \echo 'Classroom RLS and policies (migration 0031 expects RLS on and no policies)'
          with expected(schema_name, table_name) as (
            values ('public', 'classroom_connections'),
                   ('private', 'classroom_oauth_transactions')
          )
          select format('%I.%I | %s | policies=[%s] | %s', e.schema_name, e.table_name,
                 case when c.oid is null then 'MISSING TABLE'
                      when not c.relrowsecurity then 'ALERT: RLS DISABLED'
                      else 'RLS enabled' || case when c.relforcerowsecurity then ' FORCE' else '' end
                 end,
                 coalesce((
                   select string_agg(format('%s roles=%s cmd=%s using=%s check=%s',
                     p.policyname, array_to_string(p.roles, ','), p.cmd,
                     coalesce(p.qual, '-'), coalesce(p.with_check, '-')), '; ' order by p.policyname)
                     from pg_catalog.pg_policies p
                    where p.schemaname = e.schema_name and p.tablename = e.table_name
                 ), 'none'),
                 case when c.oid is null then 'ALERT: table missing'
                      when not c.relrowsecurity then 'ALERT: RLS required'
                      when c.relforcerowsecurity then 'REVIEW: FORCE is not set by migration 0031'
                      when exists (select 1 from pg_catalog.pg_policies p
                        where p.schemaname = e.schema_name and p.tablename = e.table_name)
                        then 'REVIEW: migration 0031 defines no policies'
                      else 'OK' end)
            from expected e
            left join pg_catalog.pg_namespace n on n.nspname = e.schema_name
            left join pg_catalog.pg_class c on c.relnamespace = n.oid and c.relname = e.table_name;

          \echo 'Effective Classroom table privileges (unexpected browser grants flagged)'
          with roles(role_name) as (values ('anon'), ('authenticated'), ('service_role'), ('postgres')),
          privileges(privilege) as (values ('SELECT'), ('INSERT'), ('UPDATE'), ('DELETE'),
                                    ('TRUNCATE'), ('REFERENCES'), ('TRIGGER')),
          target as (
            select n.nspname, c.relname, c.oid
              from pg_catalog.pg_class c join pg_catalog.pg_namespace n on n.oid = c.relnamespace
             where (n.nspname, c.relname) in (
               ('public', 'classroom_connections'), ('private', 'classroom_oauth_transactions'))
          ), checked as (
            select t.nspname, t.relname, r.role_name, p.privilege,
                   pg_catalog.has_table_privilege(r.role_name::name, t.oid, p.privilege) as allowed
              from target t cross join roles r cross join privileges p
          )
          select format('%I.%I | %s | allowed=%s | %s', nspname, relname, role_name,
                 coalesce(string_agg(privilege, ',' order by privilege) filter (where allowed), 'none'),
                 case when role_name in ('anon', 'authenticated') and bool_or(allowed)
                        then 'ALERT: browser table access'
                      when role_name = 'service_role' and
                        count(*) filter (where privilege in ('SELECT','INSERT','UPDATE','DELETE') and allowed) < 4
                        then 'ALERT: service_role missing CRUD'
                      when role_name = 'service_role' and bool_or(allowed and privilege not in ('SELECT','INSERT','UPDATE','DELETE'))
                        then 'REVIEW: extra service_role table privilege'
                      else 'OK' end)
            from checked group by nspname, relname, role_name order by nspname, relname, role_name;

          \echo 'Effective column-only privileges (table-wide rights are summarized above)'
          with roles(role_name) as (values ('anon'), ('authenticated'), ('service_role'), ('postgres')),
          privileges(privilege) as (values ('SELECT'), ('INSERT'), ('UPDATE'), ('REFERENCES')),
          target as (
            select n.nspname, c.relname, c.oid, a.attname
              from pg_catalog.pg_attribute a
              join pg_catalog.pg_class c on c.oid = a.attrelid
              join pg_catalog.pg_namespace n on n.oid = c.relnamespace
             where (n.nspname, c.relname) in (
               ('public', 'classroom_connections'), ('private', 'classroom_oauth_transactions'))
               and a.attnum > 0 and not a.attisdropped
          ), checked as (
            select t.nspname, t.relname, t.attname, r.role_name, p.privilege,
                   pg_catalog.has_column_privilege(r.role_name::name, t.oid, t.attname::text, p.privilege)
                     and not pg_catalog.has_table_privilege(r.role_name::name, t.oid, p.privilege) as allowed
              from target t cross join roles r cross join privileges p
          )
          select format('%I.%I | %s | extra column grants=%s | %s', nspname, relname, role_name,
                 coalesce(string_agg(format('%I:%s', attname, privilege), ',' order by attname, privilege)
                   filter (where allowed), 'none'),
                 case when role_name in ('anon', 'authenticated') and bool_or(allowed)
                        then 'ALERT: browser column access'
                      else 'OK' end)
            from checked group by nspname, relname, role_name order by nspname, relname, role_name;

          \echo 'Effective public/private/vault schema privileges'
          with expected(schema_name) as (values ('public'), ('private'), ('vault')),
          roles(role_name) as (values ('anon'), ('authenticated'), ('service_role'), ('postgres')),
          checked as (
            select e.schema_name, r.role_name, n.oid,
                   n.oid is not null as schema_exists,
                   case when n.oid is not null
                     then pg_catalog.has_schema_privilege(r.role_name::name, n.oid, 'USAGE') else false end as can_use,
                   case when n.oid is not null
                     then pg_catalog.has_schema_privilege(r.role_name::name, n.oid, 'CREATE') else false end as can_create
              from expected e cross join roles r
              left join pg_catalog.pg_namespace n on n.nspname = e.schema_name
          )
          select format('%s | %s | usage=%s create=%s | %s', schema_name, role_name,
                 can_use, can_create,
                 case when not schema_exists then 'ALERT: schema missing'
                      when schema_name = 'private' and role_name in ('anon','authenticated') and (can_use or can_create)
                        then 'ALERT: browser access to private schema'
                      when schema_name = 'private' and role_name = 'service_role' and not can_use
                        then 'ALERT: service_role lacks private schema usage'
                      when schema_name = 'vault' and role_name in ('anon','authenticated') and (can_use or can_create)
                        then 'ALERT: browser access to Vault schema'
                      else 'OK' end)
            from checked order by schema_name, role_name;

          \echo 'Relevant Classroom functions (source omitted)'
          select format('%I.%I(%s) returns %s | owner=%I | security_definer=%s | execute_roles=%s | %s',
                 n.nspname, p.proname,
                 pg_catalog.pg_get_function_identity_arguments(p.oid),
                 pg_catalog.pg_get_function_result(p.oid),
                 pg_catalog.pg_get_userbyid(p.proowner), p.prosecdef,
                 coalesce((select string_agg(r.role_name, ',' order by r.role_name)
                   from (values ('anon'), ('authenticated'), ('service_role'), ('postgres')) as r(role_name)
                   where pg_catalog.has_function_privilege(r.role_name::name, p.oid, 'EXECUTE')), 'none'),
                 case when not p.prosecdef then 'ALERT: SECURITY DEFINER expected'
                      when pg_catalog.has_function_privilege('anon'::name, p.oid, 'EXECUTE')
                        or pg_catalog.has_function_privilege('authenticated'::name, p.oid, 'EXECUTE')
                        then 'ALERT: browser EXECUTE grant'
                      when n.nspname = 'public'
                        and not pg_catalog.has_function_privilege('service_role'::name, p.oid, 'EXECUTE')
                        then 'ALERT: service_role EXECUTE missing'
                      else 'OK' end)
            from pg_catalog.pg_proc p join pg_catalog.pg_namespace n on n.oid = p.pronamespace
           where (n.nspname, p.proname) in (
             ('public','classroom_create_oauth_transaction'), ('public','classroom_consume_oauth_transaction'),
             ('public','classroom_save_connection'), ('public','classroom_get_refresh_token'),
             ('public','classroom_disconnect_connection'), ('public','classroom_mark_reauthorization_required'),
             ('public','classroom_record_token_refresh'), ('private','delete_classroom_refresh_secret'))
           order by n.nspname, p.proname, pg_catalog.pg_get_function_identity_arguments(p.oid);

          \echo 'Missing expected Classroom functions (no row means none)'
          with expected(schema_name, function_name) as (values
            ('public','classroom_create_oauth_transaction'), ('public','classroom_consume_oauth_transaction'),
            ('public','classroom_save_connection'), ('public','classroom_get_refresh_token'),
            ('public','classroom_disconnect_connection'), ('public','classroom_mark_reauthorization_required'),
            ('public','classroom_record_token_refresh'), ('private','delete_classroom_refresh_secret'))
          select format('ALERT: missing %I.%I', e.schema_name, e.function_name)
            from expected e where not exists (
              select 1 from pg_catalog.pg_proc p join pg_catalog.pg_namespace n on n.oid = p.pronamespace
               where n.nspname = e.schema_name and p.proname = e.function_name);

          \echo 'Classroom triggers and associated function security'
          select format('%I.%I | trigger=%I enabled=%s | function=%I.%I owner=%I security_definer=%s | %s',
                 n.nspname, c.relname, t.tgname,
                 case t.tgenabled when 'O' then 'yes' when 'A' then 'always' when 'R' then 'replica' else 'no' end,
                 pn.nspname, p.proname, pg_catalog.pg_get_userbyid(p.proowner), p.prosecdef,
                 case when t.tgenabled = 'D' then 'ALERT: trigger disabled'
                      when not p.prosecdef then 'ALERT: SECURITY DEFINER expected'
                      else 'OK' end)
            from pg_catalog.pg_trigger t join pg_catalog.pg_class c on c.oid = t.tgrelid
            join pg_catalog.pg_namespace n on n.oid = c.relnamespace
            join pg_catalog.pg_proc p on p.oid = t.tgfoid
            join pg_catalog.pg_namespace pn on pn.oid = p.pronamespace
           where not t.tgisinternal and (n.nspname, c.relname) in (
             ('public','classroom_connections'), ('private','classroom_oauth_transactions'))
           order by n.nspname, c.relname, t.tgname;
          select 'ALERT: expected trigger public.classroom_connections.classroom_connection_delete_secret is missing'
           where not exists (
             select 1 from pg_catalog.pg_trigger t join pg_catalog.pg_class c on c.oid = t.tgrelid
             join pg_catalog.pg_namespace n on n.oid = c.relnamespace
             where n.nspname = 'public' and c.relname = 'classroom_connections'
               and t.tgname = 'classroom_connection_delete_secret' and not t.tgisinternal);

          \echo 'Vault extension and required object metadata'
          select format('supabase_vault | version=%s schema=%I owner=%I', e.extversion, n.nspname,
                        pg_catalog.pg_get_userbyid(e.extowner))
            from pg_catalog.pg_extension e join pg_catalog.pg_namespace n on n.oid = e.extnamespace
           where e.extname = 'supabase_vault'
          union all
          select 'ALERT: supabase_vault extension is missing'
           where not exists (select 1 from pg_catalog.pg_extension where extname = 'supabase_vault');

          with expected(object_name, expected_kind) as (values ('secrets','table'), ('decrypted_secrets','view'))
          select format('vault.%I | %s | owner=%I | %s', e.object_name,
                 case when c.oid is null then 'MISSING' else e.expected_kind end,
                 coalesce(pg_catalog.pg_get_userbyid(c.relowner), 'unknown'),
                 case when c.oid is null then 'ALERT: required Vault object missing' else 'present' end)
            from expected e left join pg_catalog.pg_namespace n on n.nspname = 'vault'
            left join pg_catalog.pg_class c on c.relnamespace = n.oid and c.relname = e.object_name
           order by e.object_name;

          \echo 'Effective Vault object permissions (no secret rows or names queried)'
          with roles(role_name) as (values ('anon'), ('authenticated'), ('service_role'), ('postgres')),
          privileges(privilege) as (values ('SELECT'), ('INSERT'), ('UPDATE'), ('DELETE')),
          objects as (
            select c.oid, c.relname from pg_catalog.pg_class c
            join pg_catalog.pg_namespace n on n.oid = c.relnamespace
            where n.nspname = 'vault' and c.relname in ('secrets','decrypted_secrets')
          ), checked as (
            select o.oid, o.relname, r.role_name, p.privilege,
                   pg_catalog.has_table_privilege(r.role_name::name, o.oid, p.privilege) as allowed
              from objects o cross join roles r cross join privileges p
          )
          select format('vault.%I | %s | allowed=%s | %s', relname, role_name,
                 coalesce(string_agg(privilege, ',' order by privilege) filter (where allowed), 'none'),
                 case when role_name in ('anon','authenticated') and bool_or(allowed)
                        then 'ALERT: browser Vault object access' else 'OK' end)
            from checked group by relname, role_name order by relname, role_name;

          \echo 'Vault create_secret function permissions'
          select format('vault.create_secret(%s) | owner=%I security_definer=%s | execute_roles=%s | %s',
                 pg_catalog.pg_get_function_identity_arguments(p.oid),
                 pg_catalog.pg_get_userbyid(p.proowner), p.prosecdef,
                 coalesce((select string_agg(r.role_name, ',' order by r.role_name)
                   from (values ('anon'), ('authenticated'), ('service_role'), ('postgres')) as r(role_name)
                   where pg_catalog.has_function_privilege(r.role_name::name, p.oid, 'EXECUTE')), 'none'),
                 case when pg_catalog.has_function_privilege('anon'::name, p.oid, 'EXECUTE')
                        or pg_catalog.has_function_privilege('authenticated'::name, p.oid, 'EXECUTE')
                        then 'ALERT: browser EXECUTE grant' else 'OK' end)
            from pg_catalog.pg_proc p join pg_catalog.pg_namespace n on n.oid = p.pronamespace
           where n.nspname = 'vault' and p.proname = 'create_secret';
          select 'ALERT: vault.create_secret function is missing'
           where not exists (select 1 from pg_catalog.pg_proc p
             join pg_catalog.pg_namespace n on n.oid = p.pronamespace
             where n.nspname = 'vault' and p.proname = 'create_secret');
          SQL

      - name: Show remote migration status
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase migration list --db-url "$SUPABASE_DB_URL"

      - name: Preview pending migrations without applying them
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase db push --dry-run --db-url "$SUPABASE_DB_URL"
