<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="amber">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>University · Student Planner</title>
<script src="../../assets/js/core/theme.js"></script>
<meta name="theme-color" content="#0F172A">
<link rel="manifest" href="../../manifest.json">
<link rel="icon" href="../../assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="../../assets/icons/icon-192.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="../../assets/css/main.css" rel="stylesheet">
<link href="../../assets/css/pages/curriculum.css" rel="stylesheet">
<link href="../../assets/css/pages/university.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main-content">

    <div class="topbar">
      <div>
        <h1 class="page-title">University</h1>
        <p class="page-sub">Quezon City University</p>
      </div>
    </div>

    <!-- Full-width 3-tab nav -->
    <div class="univ-tabs mb-3">
      <button id="tab-about"     class="univ-tab-btn" onclick="switchTab('about')">
        <i class="bi bi-info-circle-fill"></i><span>About</span>
      </button>
      <button id="tab-directory" class="univ-tab-btn" onclick="switchTab('directory')">
        <i class="bi bi-person-lines-fill"></i><span>University Directory</span>
      </button>
      <button id="tab-student"   class="univ-tab-btn" onclick="switchTab('student')">
        <i class="bi bi-mortarboard-fill"></i><span>Student</span>
      </button>
    </div>

    <!-- Panels -->
    <div id="panel-about"     class="univ-panel d-none"></div>

    <div id="panel-directory" class="univ-panel d-none">
      <div class="cur-search-wrap mb-3">
        <i class="bi bi-search cur-search-icon"></i>
        <input id="dirSearch" type="text" class="form-control cur-search-input"
               placeholder="Search office, officer, email, phone…">
      </div>
      <div id="dirContainer"></div>
    </div>

    <div id="panel-student" class="univ-panel d-none"></div>

  </main>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/utils/dates.js"></script>
<script src="../../assets/js/utils/dom.js"></script>
<script src="../../assets/js/data/storage.js"></script>
<script src="../../assets/js/core/ui.js"></script>
<script src="../../assets/js/core/layout.js"></script>
<script src="../../assets/js/core/pwa.js"></script>
<script src="../../assets/js/modules/university.js"></script>
<script>
  renderShell('university');
  applyTheme();
  initUniversity();
</script>
</body>
</html>
