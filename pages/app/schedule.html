<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="blue">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schedule · Student Planner</title>
<script src="../../assets/js/core/theme.js"></script>
<meta name="theme-color" content="#0F172A">
<link rel="manifest" href="../../manifest.json">
<link rel="icon" href="../../assets/icons/icon-192.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="../../assets/css/main.css" rel="stylesheet">
<link href="../../assets/css/pages/schedule.css" rel="stylesheet">
<link href="../../assets/css/pages/attendance.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main-content">

    <!-- Page header -->
    <div class="topbar sch-topbar">
      <div class="sch-topbar-left">
        <h1 class="page-title">Schedule</h1>
        <p class="page-sub">Manage your classes, timetable, and weekly academic schedule.</p>
      </div>
      <!-- Add Subject: full width, same size as the Tasks page's Add Task button -->
      <button class="btn btn-accent sch-add-btn" onclick="openSubjectModal()" aria-label="Add new subject">
        <i class="bi bi-plus-lg me-1" aria-hidden="true"></i>Add Subject
      </button>
    </div>

    <!-- Week navigation -->
    <div class="glass card-pad mb-3 fade-in sch-nav-card">
      <div class="sch-week-nav">
        <button class="btn-icon sch-nav-btn sch-chevron-btn" onclick="shiftWeek(-1)" title="Previous week" aria-label="Previous week"><i class="bi bi-chevron-left" aria-hidden="true"></i></button>
        <div class="sch-week-label" id="schWeekLabel" aria-live="polite"></div>
        <button class="btn-icon sch-nav-btn sch-chevron-btn" onclick="shiftWeek(1)" title="Next week" aria-label="Next week"><i class="bi bi-chevron-right" aria-hidden="true"></i></button>
        <button class="btn btn-ghost btn-sm sch-today-btn" onclick="goToday()" title="Go to today" aria-label="Go to today">Today</button>
        <!-- Single View button: opens an anchored dropdown to choose Day / Week / Subject list -->
        <div class="dropdown sch-view-dropdown">
          <button class="btn-icon sch-nav-btn sch-chevron-btn sch-view-btn" id="schViewBtn" type="button" data-bs-toggle="dropdown" data-bs-auto-close="true" aria-expanded="false" aria-label="Change schedule view" title="Change schedule view">
            <i class="bi bi-calendar-day" id="schViewBtnIcon" aria-hidden="true"></i>
            <span id="schViewBtnLabel" class="visually-hidden">Day</span>
          </button>
          <div class="dropdown-menu dropdown-menu-end sch-view-menu" id="schViewMenu" aria-label="Schedule view options"></div>
        </div>
      </div>
      <!-- Day selector strip -->
      <div class="sch-day-strip" id="schDayStrip" role="tablist" aria-label="Select day"></div>
    </div>

    <!-- Next class / current class card -->
    <div id="schNextCard" class="mb-3 fade-in" aria-live="polite"></div>

    <!-- Day view -->
    <div id="schDayView" role="region" aria-label="Day schedule"></div>

    <!-- Timetable view -->
    <div id="schTimetableView" class="d-none" role="region" aria-label="Weekly timetable">
      <div class="glass card-pad mb-3 fade-in">
        <div class="d-flex justify-content-between align-items-center mb-3 sch-tt-header-row">
          <div class="section-title mb-0"><i class="bi bi-calendar2-week" aria-hidden="true"></i>Weekly Timetable</div>
          <div class="sch-tt-controls">
            <div class="sch-zoom-controls" aria-label="Timetable zoom">
              <button class="sch-zoom-btn" id="ttZoomOut" onclick="ttZoom(-1)" title="Zoom out" aria-label="Zoom out timetable"><i class="bi bi-dash-lg" aria-hidden="true"></i></button>
              <span class="sch-zoom-badge" id="ttZoomBadge" aria-live="polite" aria-label="Zoom level">100%</span>
              <button class="sch-zoom-btn" id="ttZoomIn" onclick="ttZoom(1)" title="Zoom in" aria-label="Zoom in timetable"><i class="bi bi-plus-lg" aria-hidden="true"></i></button>
            </div>
          </div>
        </div>
        <div class="scroll-x grabbable">
          <div id="ttGrid" style="min-width:560px"></div>
        </div>
      </div>
    </div>

    <!-- Subject list view -->
    <div id="schListView" class="d-none" role="region" aria-label="Subject list">
      <div class="glass card-pad mb-3 fade-in">
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
          <div class="section-title mb-0"><i class="bi bi-journal-bookmark" aria-hidden="true"></i>All Subjects</div>
        </div>
        <div class="sch-list-controls mb-3">
          <input class="form-control sch-list-search" id="schSearchInput" placeholder="Search…" oninput="renderListView()" aria-label="Search subjects">
          <button class="btn btn-ghost btn-sm sch-list-archive-btn" id="schArchiveBtn" onclick="toggleArchivedView()" aria-label="Toggle archived subjects" aria-pressed="false"><i class="bi bi-archive me-1" aria-hidden="true"></i>Archived</button>
        </div>
        <div id="schSubjectList" class="row g-3 stagger" role="list"></div>
      </div>
    </div>

    <!-- Today's tasks panel (day view only) -->
    <div id="schTasksPanel" class="mb-3"></div>

  </main>
</div>

<!-- Subject Modal -->
<div class="modal fade" id="subjectModal" tabindex="-1" aria-modal="true" role="dialog" aria-labelledby="subjectModalTitle">
  <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title" id="subjectModalTitle">Add Subject</h5><button type="button" class="btn-close btn-close-white" aria-label="Close modal" data-bs-dismiss="modal"></button></div>
      <div class="modal-body" id="subjectModalBody"></div>
    </div>
  </div>
</div>

<!-- Subject Detail Modal -->
<div class="modal fade" id="detailModal" tabindex="-1" aria-modal="true" role="dialog">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content card-pad" id="detailModalBody"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../../assets/js/utils/dates.js"></script>
<script src="../../assets/js/utils/dom.js"></script>
<script src="../../assets/js/data/storage.js"></script>
<script src="../../assets/js/core/ui.js"></script>
<script src="../../assets/js/core/custom-select.js"></script>
<script src="../../assets/js/core/layout.js"></script>
<script src="../../assets/js/core/pwa.js"></script>
<script src="../../assets/js/modules/schedule.js"></script>
<script>
  renderShell('schedule');
  applyTheme();
  initSchedule();
</script>
</body>
</html>
