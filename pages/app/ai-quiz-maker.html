<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="blue">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Quiz Maker · Student Planner</title>
<script src="../../assets/js/core/app-guard.js"></script>
<script src="../../assets/js/core/theme.js"></script>
<meta name="theme-color" content="#0F172A">
<link rel="manifest" href="../../manifest.json">
<link rel="icon" href="../../assets/icons/icon-192.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="../../assets/css/main.css" rel="stylesheet">
<link href="../../assets/css/pages/ai-tools.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main-content">
    <div class="topbar"><div><h1 class="page-title">AI Quiz Maker</h1><p class="page-sub">Turn your study materials into a practice quiz.</p></div></div>

    <!-- CREATION FORM + HISTORY (two-column on desktop, stacked on mobile) -->
    <div class="aqm-layout">
      <form class="glass card-pad fade-in" id="aqmForm" novalidate>
        <div class="ai-field">
          <label for="aqmTopic">Topic or subject</label>
          <input type="text" class="form-control" id="aqmTopic" placeholder="e.g. Photosynthesis, Philippine History, Data Structures" maxlength="150">
        </div>
        <div class="ai-field">
          <label for="aqmNotes">Instructions or study notes <span class="text-soft fw-normal">(optional)</span></label>
          <textarea class="form-control" id="aqmNotes" rows="4" placeholder="Paste notes, or describe what the quiz should focus on…" maxlength="6000"></textarea>
        </div>

        <div class="ai-field">
          <label id="aqmFileLabel">Attach a PDF or image <span class="text-soft fw-normal">(optional)</span></label>
          <input type="file" id="aqmFileInput" accept=".pdf,image/jpeg,image/png" class="d-none">
          <div class="aqm-dropzone" id="aqmDropzone" tabindex="0" role="button" aria-labelledby="aqmFileLabel" aria-describedby="aqmDropzoneHint">
            <div class="aqm-dropzone-empty" id="aqmFileEmpty">
              <i class="bi bi-cloud-arrow-up" aria-hidden="true"></i>
              <div class="aqm-dropzone-copy">
                <span class="aqm-dropzone-title"><strong>Click to upload</strong> or drag and drop</span>
                <span class="aqm-dropzone-hint" id="aqmDropzoneHint">PDF, JPG, or PNG — up to 8 MB</span>
              </div>
            </div>
            <div class="ai-file-info aqm-dropzone-file" id="aqmFileInfo" hidden>
              <!-- filled in by initAiFileAttachment -->
              <button type="button" class="btn-icon btn-sm aqm-file-remove" id="aqmFileRemove" hidden aria-label="Remove attachment"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
            </div>
          </div>
        </div>

        <div class="ai-field-row">
          <div class="ai-field mb-0">
            <div class="aqm-range-head">
              <label for="aqmQuestionCount" class="mb-0">Number of questions</label>
              <span class="aqm-range-value" id="aqmQuestionCountLabel">10</span>
            </div>
            <input type="range" class="aqm-range" id="aqmQuestionCount" min="1" max="20" step="1" value="10">
          </div>
          <div class="ai-field mb-0">
            <label id="aqmDifficultyLabel">Difficulty</label>
            <div class="aqm-pills" id="aqmDifficultyGroup" role="radiogroup" aria-labelledby="aqmDifficultyLabel">
              <button type="button" class="aqm-pill" data-value="easy" role="radio" aria-checked="false">Easy</button>
              <button type="button" class="aqm-pill is-selected" data-value="medium" role="radio" aria-checked="true">Medium</button>
              <button type="button" class="aqm-pill" data-value="hard" role="radio" aria-checked="false">Hard</button>
            </div>
            <input type="hidden" id="aqmDifficulty" value="medium">
          </div>
        </div>

        <button type="submit" class="btn btn-accent w-100 aqm-generate-btn" id="aqmGenerateBtn"><i class="bi bi-stars" aria-hidden="true"></i> Generate Quiz</button>
      </form>

      <!-- SAVED QUIZZES -->
      <section class="glass card-pad aqm-history fade-in" id="aqmHistorySection" aria-labelledby="aqmHistoryHeading">
        <h2 class="aqm-history-heading" id="aqmHistoryHeading"><i class="bi bi-clock-history" aria-hidden="true"></i><span>Your saved quizzes</span></h2>
        <div class="aqm-history-list" id="aqmHistory" aria-live="polite">
          <div class="aqm-history-empty">
            <i class="bi bi-hourglass-split" aria-hidden="true"></i>
            <p>Loading your saved quizzes…</p>
          </div>
        </div>
      </section>
    </div>

    <!-- LOADING -->
    <div class="glass card-pad fade-in ai-state" id="aqmLoadingState" hidden>
      <i class="bi bi-arrow-repeat ai-spin" aria-hidden="true"></i>
      <p>Generating your quiz… this can take a few seconds.</p>
    </div>

    <!-- ERROR -->
    <div class="glass card-pad fade-in ai-state ai-state-error" id="aqmErrorState" hidden>
      <i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i>
      <p id="aqmErrorMessage">Something went wrong.</p>
      <button type="button" class="btn btn-ghost mt-2" id="aqmRetryBtn"><i class="bi bi-arrow-repeat" aria-hidden="true"></i> Try again</button>
    </div>

    <!-- QUIZ TAKING -->
    <div class="glass card-pad fade-in aqm-stage" id="aqmQuizCard" hidden>
      <h2 class="h5 mb-3" id="aqmQuizTitle"></h2>
      <div class="ai-quiz-progress"><span id="aqmProgressLabel"></span></div>
      <div class="ai-progress-bar"><div class="ai-progress-bar-fill" id="aqmProgressFill"></div></div>
      <p class="ai-quiz-question" id="aqmQuestionText"></p>
      <div class="ai-choices" id="aqmChoices" role="group" aria-label="Answer choices"></div>
      <div class="ai-explanation" id="aqmExplanation" hidden></div>
      <div class="ai-quiz-nav">
        <button type="button" class="btn-ghost" id="aqmPrevBtn"><i class="bi bi-arrow-left" aria-hidden="true"></i> Previous</button>
        <button type="button" class="btn btn-accent" id="aqmNextBtn">Next <i class="bi bi-arrow-right" aria-hidden="true"></i></button>
        <button type="button" class="btn btn-accent" id="aqmSubmitBtn" hidden><i class="bi bi-check2-circle" aria-hidden="true"></i> Submit Quiz</button>
        <button type="button" class="btn btn-accent" id="aqmViewResultsBtn" hidden><i class="bi bi-bar-chart-fill" aria-hidden="true"></i> View Results</button>
      </div>
    </div>

    <!-- RESULTS -->
    <div class="glass card-pad fade-in aqm-stage" id="aqmResultsCard" hidden>
      <div class="text-center">
        <div class="ai-score-ring" id="aqmScoreRing"><div class="ai-score-ring-inner"><strong id="aqmScorePercent">0%</strong><span id="aqmScoreFraction">0 / 0</span></div></div>
        <h2 class="h5">Quiz complete!</h2>
      </div>
      <h3 class="h6 mt-4 mb-2">Answer review</h3>
      <div id="aqmReviewList"></div>
      <div class="d-flex gap-2 mt-3">
        <button type="button" class="btn btn-accent" id="aqmRetakeBtn"><i class="bi bi-arrow-repeat" aria-hidden="true"></i> Retake Quiz</button>
        <button type="button" class="btn-ghost" id="aqmNewQuizBtn"><i class="bi bi-plus-lg" aria-hidden="true"></i> New Quiz</button>
      </div>
    </div>

  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../../assets/js/utils/dates.js"></script>
<script src="../../assets/js/utils/dom.js"></script>
<script src="../../assets/js/utils/ai-file-upload.js"></script>
<script src="../../assets/js/data/storage.js"></script>
<script src="../../assets/js/core/ui.js"></script>
<script src="../../assets/js/core/custom-select.js"></script>
<script src="../../assets/js/core/layout.js"></script>
<script src="../../assets/js/core/pwa.js"></script>
<script src="../../assets/js/modules/ai-quiz-maker.js"></script>
<script>
  renderShell('ai-quiz-maker');
  applyTheme();
  initAiQuizMaker();
</script>
</body>
</html>
