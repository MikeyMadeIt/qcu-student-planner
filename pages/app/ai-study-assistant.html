<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="blue">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Study Assistant · Student Planner</title>
<script src="../../assets/js/core/app-guard.js"></script>
<script src="../../assets/js/core/theme.js"></script>
<meta name="theme-color" content="#0F172A">
<link rel="manifest" href="../../manifest.json">
<link rel="icon" href="../../assets/icons/icon-192.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="../../assets/css/main.css" rel="stylesheet">
<link href="../../assets/css/pages/ai-tools.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main-content main-content--asa">

    <div class="asa-header">
      <span class="asa-mode-label"><i class="bi bi-stars" aria-hidden="true"></i>Study mode</span>
      <div class="asa-header-actions">
        <div class="asa-dropdown" id="asaDropdown">
          <button type="button" class="asa-dropdown-btn" id="asaDropdownToggle" aria-haspopup="true" aria-expanded="false" aria-controls="asaDropdownPanel">
            <i class="bi bi-clock-history" aria-hidden="true"></i>
            <span>Conversations</span>
            <i class="bi bi-chevron-down asa-dropdown-caret" aria-hidden="true"></i>
          </button>
          <div class="asa-dropdown-panel" id="asaDropdownPanel" hidden>
            <div class="asa-search">
              <i class="bi bi-search" aria-hidden="true"></i>
              <input type="search" id="asaSearch" placeholder="Search conversations" aria-label="Search conversations">
            </div>
            <div class="asa-history" id="asaHistory" aria-live="polite">
              <div class="text-faint" style="font-size:.85rem;padding:.5rem .25rem">Loading your conversations…</div>
            </div>
          </div>
        </div>
        <button type="button" class="asa-new-chat-btn" id="asaClearBtn">
          <i class="bi bi-plus-lg" aria-hidden="true"></i> <span class="d-none d-sm-inline">New chat</span>
        </button>
      </div>
    </div>

    <section class="asa-main">
      <div class="ai-chat-shell" id="asaChatShell">
        <div class="ai-chat-log" id="asaChatLog" aria-live="polite"></div>

        <div class="ai-msg ai-msg-assistant ai-typing-row" id="asaTypingRow" hidden style="align-self:flex-start;width:fit-content;margin-bottom:.75rem">
          <span class="ai-typing-dots"><span></span><span></span><span></span></span>
        </div>

        <div class="ai-state ai-state-error" id="asaErrorBanner" hidden style="padding:1rem">
          <i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i>
          <p id="asaErrorMessage">Something went wrong.</p>
        </div>

        <form class="ai-chat-composer" id="asaForm" novalidate>
          <div class="ai-chat-attach-bar" id="asaAttachBar" hidden>
            <input type="file" id="asaFileInput" accept=".pdf,image/jpeg,image/png" class="d-none">
            <div class="ai-file-info" id="asaFileInfo" hidden></div>
            <button type="button" class="btn-ghost" id="asaFileRemove" hidden aria-label="Remove attachment"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
          </div>
          <div class="ai-chat-input-row">
            <button type="button" class="asa-icon-btn asa-attach-trigger" id="asaAttachBtn" aria-label="Attach file"><i class="bi bi-paperclip" aria-hidden="true"></i></button>
            <textarea class="form-control" id="asaInput" rows="1" placeholder="Ask anything about your lessons…" maxlength="6000" aria-label="Message"></textarea>
            <button type="submit" class="ai-icon-btn" id="asaSendBtn" aria-label="Send message"><i class="bi bi-send-fill" aria-hidden="true"></i></button>
          </div>
        </form>
      </div>
    </section>

  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../../assets/js/utils/dates.js"></script>
<script src="../../assets/js/utils/dom.js"></script>
<script src="../../assets/js/utils/ai-file-upload.js"></script>
<script src="../../assets/js/data/storage.js"></script>
<script src="../../assets/js/core/ui.js"></script>
<script src="../../assets/js/core/custom-select.js"></script>
<script src="../../assets/js/core/layout.js"></script>
<script src="../../assets/js/core/pwa.js"></script>
<script src="../../assets/js/core/markdown.js"></script>
<script src="../../assets/js/modules/ai-study-assistant.js"></script>
<script>
  renderShell('ai-study-assistant');
  applyTheme();
  initAiStudyAssistant();
</script>
</body>
</html>
