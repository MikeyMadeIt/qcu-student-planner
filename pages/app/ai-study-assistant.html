<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="blue">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Study Assistant · Student Planner</title>
<script src="../../assets/js/core/theme.js"></script>
<meta name="theme-color" content="#0F172A">
<link rel="manifest" href="../../manifest.json">
<link rel="icon" href="../../assets/icons/icon-192.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="../../assets/css/main.css" rel="stylesheet">
<link href="../../assets/css/pages/ai-tools.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main-content">
    <div class="topbar">
      <div><h1 class="page-title">AI Study Assistant</h1><p class="page-sub">Ask questions, get explanations, and study your materials.</p></div>
      <button type="button" class="btn-ghost" id="asaClearBtn"><i class="bi bi-trash3" aria-hidden="true"></i> Clear conversation</button>
    </div>

    <div class="glass card-pad fade-in ai-chat-shell">
      <div class="ai-chat-log" id="asaChatLog" aria-live="polite"></div>

      <div class="ai-msg ai-msg-assistant ai-typing-row" id="asaTypingRow" hidden style="align-self:flex-start;width:fit-content;margin-bottom:.75rem">
        <span class="ai-typing-dots"><span></span><span></span><span></span></span>
      </div>

      <div class="ai-state ai-state-error" id="asaErrorBanner" hidden style="padding:1rem">
        <i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i>
        <p id="asaErrorMessage">Something went wrong.</p>
      </div>

      <form class="ai-chat-composer" id="asaForm" novalidate>
        <div class="ai-chat-attach-bar">
          <input type="file" id="asaFileInput" accept=".pdf,image/jpeg,image/png" class="d-none">
          <div class="ai-attach">
            <span class="ai-attach-empty" id="asaFileEmpty"><i class="bi bi-paperclip" aria-hidden="true"></i>No file attached</span>
            <span class="ai-file-info" id="asaFileInfo" hidden></span>
            <div class="ai-attach-actions">
              <button type="button" class="btn-ghost" id="asaAttachBtn"><i class="bi bi-upload" aria-hidden="true"></i> Attach file</button>
              <button type="button" class="btn-ghost" id="asaFileRemove" hidden aria-label="Remove attachment"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
            </div>
          </div>
        </div>
        <div class="ai-chat-input-row">
          <textarea class="form-control" id="asaInput" rows="1" placeholder="Ask a question, request a summary, or get an explanation…" maxlength="6000" aria-label="Message"></textarea>
          <button type="submit" class="ai-icon-btn" id="asaSendBtn" aria-label="Send message"><i class="bi bi-send-fill" aria-hidden="true"></i></button>
        </div>
      </form>
    </div>

  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../../assets/js/utils/dates.js"></script>
<script src="../../assets/js/utils/dom.js"></script>
<script src="../../assets/js/utils/ai-file-upload.js"></script>
<script src="../../assets/js/data/storage.js"></script>
<script src="../../assets/js/core/ui.js"></script>
<script src="../../assets/js/core/custom-select.js"></script>
<script src="../../assets/js/core/layout.js"></script>
<script src="../../assets/js/core/pwa.js"></script>
<script src="../../assets/js/modules/ai-study-assistant.js"></script>
<script>
  renderShell('ai-study-assistant');
  applyTheme();
  initAiStudyAssistant();
</script>
</body>
</html>
