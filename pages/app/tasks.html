<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="blue">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tasks · Student Planner</title>
<script src="../../assets/js/core/theme.js"></script>
<meta name="theme-color" content="#0F172A">
<link rel="manifest" href="../../manifest.json">
<link rel="icon" href="../../assets/icons/icon-192.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="../../assets/css/main.css" rel="stylesheet">
<link href="../../assets/css/pages/tasks.css" rel="stylesheet">
<link href="../../assets/css/pages/attendance.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main-content">

    <!-- PAGE HEADER -->
    <div class="tk-header fade-in">
      <div class="tk-header-text">
        <h1 class="page-title">Tasks</h1>
        <p class="page-sub">Stay on top of your academic and personal work.</p>
      </div>
      <button class="btn btn-accent" onclick="openTaskModal()" aria-label="Add new task"><i class="bi bi-plus-lg me-1"></i>Add Task</button>
    </div>

    <div class="tk-main-body">
      <!-- STATS ROW --> 
      <div class="tk-stats-row fade-in" id="tkStatsRow">
        <div class="tk-stat-card glass" onclick="ShortcutFilter('all')">
          <div class="tk-stat-icon tk-stat-icon-total"><i class="bi bi-list-check"></i></div>
          <div class="tk-stat-text">
            <div class="tk-stat-num" id="statTotal">0</div>
            <div class="tk-stat-lbl">Total</div>
          </div>
        </div>
        <div class="tk-stat-card glass" onclick="ShortcutFilter('active')">
          <div class="tk-stat-icon tk-stat-icon-active"><i class="bi bi-hourglass-split"></i></div>
          <div class="tk-stat-text">
            <div class="tk-stat-num tk-stat-active" id="statActive">0</div>
            <div class="tk-stat-lbl">Active</div>
          </div>
        </div>
        <div class="tk-stat-card glass" onclick="ShortcutFilter('completed')">
          <div class="tk-stat-icon tk-stat-icon-done"><i class="bi bi-check-circle"></i></div>
          <div class="tk-stat-text">
            <div class="tk-stat-num tk-stat-done" id="statDone">0</div>
            <div class="tk-stat-lbl">Done</div>
          </div>
        </div>
        <div class="tk-stat-card glass" onclick="ShortcutFilter('overdue')">
          <div class="tk-stat-icon tk-stat-icon-overdue"><i class="bi bi-exclamation-triangle"></i></div>
          <div class="tk-stat-text">
            <div class="tk-stat-num tk-stat-overdue" id="statOverdue">0</div>
            <div class="tk-stat-lbl">Overdue</div> 
          </div>
        </div>
      </div>

      
      <div class="tk-control-and-task">
        <!-- CONTROLS -->
        <div class="tk-controls fade-in">
          <div class="tk-search-wrap">
            <i class="bi bi-search tk-search-icon" aria-hidden="true"></i>
            <input class="form-control tk-search-input" id="tkSearch" placeholder="Search tasks…" autocomplete="off" aria-label="Search tasks">
          </div>
          <button class="tk-icon-btn tk-select-all-btn" id="selectAllBtn" title="Select all tasks" aria-label="Select all tasks">
            <i class="bi bi-square"></i><span>Select</span>
          </button>
          <button class="tk-icon-btn tk-filter-btn" id="filterSortBtn" title="Filter and sort tasks" aria-label="Filter and sort tasks" aria-haspopup="dialog">
            <i class="bi bi-sliders2"></i>
            <span class="tk-filter-badge" id="filterBadge" style="display:none"></span>
          </button>
          <div class="tk-view-toggle" role="group" aria-label="View mode">
            <button class="tk-view-btn active" id="tkViewList" title="List view" aria-label="List view" aria-pressed="true"><i class="bi bi-list-ul"></i></button>
            <button class="tk-view-btn" id="tkViewBoard" title="Board view" aria-label="Board view" aria-pressed="false"><i class="bi bi-kanban"></i></button>
          </div>
        </div>

        <!-- TASK GROUPS -->
        <div id="tkGroups"></div>
      </div>
    </div>

  </main>
</div>

<!-- ADD/EDIT TASK MODAL -->
<div class="modal fade" id="taskModal" tabindex="-1" aria-modal="true" role="dialog">
  <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="taskModalTitle">Add Task</h5>
        <button class="btn-close" aria-label="Close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="taskModalBody"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../../assets/js/utils/dates.js"></script>
<script src="../../assets/js/utils/dom.js"></script>
<script src="../../assets/js/data/storage.js"></script>
<script src="../../assets/js/core/ui.js"></script>
<script src="../../assets/js/core/custom-select.js"></script>
<script src="../../assets/js/core/layout.js"></script>
<script src="../../assets/js/core/pwa.js"></script>
<script src="../../assets/js/modules/tasks.js"></script>
<script>
  renderShell('tasks');
  applyTheme();
  initTasks();
</script>
</body>
</html>
