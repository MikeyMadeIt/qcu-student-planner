<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="blue">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wallpaper Generator · Student Planner</title>
<script src="../../assets/js/core/theme.js"></script>
<meta name="theme-color" content="#0F172A">
<link rel="manifest" href="../../manifest.json">
<link rel="icon" href="../../assets/icons/icon-192.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="../../assets/css/main.css" rel="stylesheet">
<link href="../../assets/css/pages/wallpaper.css" rel="stylesheet">
<link href="../../assets/css/pages/schedule.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main-content">
    <div class="topbar">
      <div><h1 class="page-title">Wallpaper Generator</h1><p class="page-sub">Design a lock-screen wallpaper with your schedule</p></div>
    </div>

    <!-- Mode Selector -->
    <div class="wp-mode-bar glass card-pad fade-in mb-3">
      <span class="wp-mode-label">Wallpaper Style</span>
      <div class="wp-mode-tabs" role="tablist" aria-label="Wallpaper style">
        <button class="wp-mode-tab active" id="modeTabList" role="tab" aria-selected="true"
                onclick="setWpMode('list')">
          <i class="bi bi-list-ul" aria-hidden="true"></i> Subject List
        </button>
        <button class="wp-mode-tab" id="modeTabTimetable" role="tab" aria-selected="false"
                onclick="setWpMode('timetable')">
          <i class="bi bi-grid" aria-hidden="true"></i> Timetable
        </button>
      </div>
    </div>

    <div class="row g-3">
      <!-- Left Controls -->
      <div class="col-lg-4">

        <!-- Theme -->
        <div class="glass card-pad fade-in mb-3">
          <div class="section-title"><i class="bi bi-palette-fill" aria-hidden="true"></i>Background</div>
          <div class="wp-theme-grid" id="themePicker" role="radiogroup" aria-label="Wallpaper background theme"></div>
        </div>

        <!-- Size -->
        <div class="glass card-pad fade-in mb-3">
          <div class="section-title"><i class="bi bi-aspect-ratio" aria-hidden="true"></i>Size</div>
          <select class="form-select mb-2" id="wpSize" aria-label="Wallpaper size" onchange="onSizeChange()">
            <option value="1080x2400">1080 × 2400 (Standard)</option>
            <option value="1440x3200">1440 × 3200 (QHD)</option>
            <option value="custom">Custom…</option>
          </select>
          <div class="wp-size-custom d-none" id="customSizeRow">
            <div><input type="number" class="form-control" id="wpW" placeholder="Width" value="1080" aria-label="Custom width" onchange="generateWallpaper()"></div>
            <div><input type="number" class="form-control" id="wpH" placeholder="Height" value="2400" aria-label="Custom height" onchange="generateWallpaper()"></div>
          </div>
        </div>

        <!-- Show/Hide Options -->
        <div class="glass card-pad fade-in mb-3">
          <div class="section-title"><i class="bi bi-toggles" aria-hidden="true"></i>Show</div>
          <div id="wpToggles" class="wp-toggles-grid"></div>
        </div>

        <!-- Actions -->
        <div class="glass card-pad fade-in">
          <button class="btn btn-accent w-100 mb-2" onclick="generateWallpaper()" aria-label="Generate wallpaper preview">
            <i class="bi bi-magic me-1" aria-hidden="true"></i>Generate Preview
          </button>
          <div class="d-flex gap-2">
            <button class="btn btn-ghost flex-grow-1" onclick="downloadWallpaper('png')" aria-label="Download wallpaper as PNG">
              <i class="bi bi-download me-1" aria-hidden="true"></i>PNG
            </button>
            <button class="btn btn-ghost flex-grow-1" onclick="downloadWallpaper('jpeg')" aria-label="Download wallpaper as JPG">
              <i class="bi bi-download me-1" aria-hidden="true"></i>JPG
            </button>
          </div>
        </div>
      </div>

      <!-- Right Preview -->
      <div class="col-lg-8">
        <div class="glass card-pad fade-in">
          <div class="section-title justify-content-center"><i class="bi bi-phone" aria-hidden="true"></i>Preview</div>
          <div class="wp-preview-shell">
            <canvas id="wpCanvas" role="img" aria-label="Wallpaper preview"></canvas>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/utils/dates.js"></script>
<script src="../../assets/js/utils/dom.js"></script>
<script src="../../assets/js/data/storage.js"></script>
<script src="../../assets/js/core/ui.js"></script>
<script src="../../assets/js/core/layout.js"></script>
<script src="../../assets/js/core/pwa.js"></script>
<script src="../../assets/js/modules/wallpaper.js"></script>
<script>
  renderShell('wallpaper');
  applyTheme();
  initWallpaper();
</script>
</body>
</html>
