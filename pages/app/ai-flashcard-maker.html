<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="blue">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Flashcard Maker · Student Planner</title>
<script src="../../assets/js/core/theme.js"></script>
<meta name="theme-color" content="#0F172A">
<link rel="manifest" href="../../manifest.json">
<link rel="icon" href="../../assets/icons/icon-192.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="../../assets/css/main.css" rel="stylesheet">
<link href="../../assets/css/pages/ai-tools.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main-content">
    <div class="topbar"><div><h1 class="page-title">AI Flashcard Maker</h1><p class="page-sub">Turn your study materials into flashcards.</p></div></div>

    <!-- CREATION FORM + HISTORY (two-column on desktop, stacked on mobile) -->
    <div class="aqm-layout">
      <form class="glass card-pad fade-in" id="afmForm" novalidate>
        <div class="ai-field">
          <label for="afmTopic">Topic or subject</label>
          <input type="text" class="form-control" id="afmTopic" placeholder="e.g. Cell Biology terms, Spanish vocabulary" maxlength="150">
        </div>
        <div class="ai-field">
          <label for="afmNotes">Instructions or study notes <span class="text-soft fw-normal">(optional)</span></label>
          <textarea class="form-control" id="afmNotes" rows="4" placeholder="Paste notes, or describe what the flashcards should cover…" maxlength="6000"></textarea>
        </div>

        <div class="ai-field">
          <label id="afmFileLabel">Attach a PDF or image <span class="text-soft fw-normal">(optional)</span></label>
          <input type="file" id="afmFileInput" accept=".pdf,image/jpeg,image/png" class="d-none">
          <div class="aqm-dropzone" id="afmDropzone" tabindex="0" role="button" aria-labelledby="afmFileLabel" aria-describedby="afmDropzoneHint">
            <div class="aqm-dropzone-empty" id="afmFileEmpty">
              <i class="bi bi-cloud-arrow-up" aria-hidden="true"></i>
              <div class="aqm-dropzone-copy">
                <span class="aqm-dropzone-title"><strong>Click to upload</strong> or drag and drop</span>
                <span class="aqm-dropzone-hint" id="afmDropzoneHint">PDF, JPG, or PNG — up to 8 MB</span>
              </div>
            </div>
            <div class="ai-file-info aqm-dropzone-file" id="afmFileInfo" hidden>
              <!-- filled in by initAiFileAttachment -->
              <button type="button" class="btn-icon btn-sm aqm-file-remove" id="afmFileRemove" hidden aria-label="Remove attachment"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
            </div>
          </div>
        </div>

        <button type="submit" class="btn btn-accent w-100 aqm-generate-btn" id="afmGenerateBtn"><i class="bi bi-stars" aria-hidden="true"></i> Generate Flashcards</button>
      </form>

      <!-- SAVED DECKS -->
      <section class="glass card-pad aqm-history fade-in" id="afmHistorySection" aria-labelledby="afmHistoryHeading">
        <h2 class="aqm-history-heading" id="afmHistoryHeading"><i class="bi bi-clock-history" aria-hidden="true"></i><span>Your saved decks</span></h2>
        <div class="aqm-history-list" id="afmHistory" aria-live="polite">
          <div class="aqm-history-empty">
            <i class="bi bi-hourglass-split" aria-hidden="true"></i>
            <p>Loading your saved decks…</p>
          </div>
        </div>
      </section>
    </div>

    <!-- LOADING -->
    <div class="glass card-pad fade-in ai-state" id="afmLoadingState" hidden>
      <i class="bi bi-arrow-repeat ai-spin" aria-hidden="true"></i>
      <p>Generating your flashcards… this can take a few seconds.</p>
    </div>

    <!-- ERROR -->
    <div class="glass card-pad fade-in ai-state ai-state-error" id="afmErrorState" hidden>
      <i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i>
      <p id="afmErrorMessage">Something went wrong.</p>
      <button type="button" class="btn btn-ghost mt-2" id="afmRetryBtn"><i class="bi bi-arrow-repeat" aria-hidden="true"></i> Try again</button>
    </div>

    <!-- FLASHCARDS -->
    <div class="glass card-pad fade-in aqm-stage" id="afmCardsPanel" hidden>
      <div class="d-flex align-items-center justify-content-between mb-3 flex-wrap gap-2">
        <h2 class="h5 mb-0" id="afmSetTitle"></h2>
        <button type="button" class="btn-ghost" id="afmNewSetBtn"><i class="bi bi-plus-lg" aria-hidden="true"></i> New Set</button>
      </div>
      <div class="ai-quiz-progress"><span id="afmProgressLabel"></span></div>
      <div class="ai-progress-bar"><div class="ai-progress-bar-fill" id="afmProgressFill"></div></div>

      <div class="ai-flashcard-stage">
        <div class="ai-flashcard" id="afmCard" role="button" tabindex="0" aria-pressed="false" aria-label="Flashcard — press to flip">
          <div class="ai-flashcard-inner">
            <div class="ai-flashcard-face ai-flashcard-face-front" id="afmCardFront"></div>
            <div class="ai-flashcard-face ai-flashcard-face-back" id="afmCardBack"></div>
          </div>
        </div>
        <p class="ai-flashcard-hint"><i class="bi bi-hand-index-thumb" aria-hidden="true"></i> Click or tap the card to flip it</p>

        <div class="ai-flashcard-controls">
          <button type="button" class="btn-ghost" id="afmPrevBtn"><i class="bi bi-arrow-left" aria-hidden="true"></i> Previous</button>
          <button type="button" class="ai-icon-btn" id="afmShuffleBtn" aria-label="Shuffle cards" title="Shuffle"><i class="bi bi-shuffle" aria-hidden="true"></i></button>
          <button type="button" class="ai-icon-btn" id="afmRestartBtn" aria-label="Restart" title="Restart"><i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i></button>
          <button type="button" class="btn btn-accent" id="afmNextBtn">Next <i class="bi bi-arrow-right" aria-hidden="true"></i></button>
        </div>
      </div>
    </div>

  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../../assets/js/utils/dates.js"></script>
<script src="../../assets/js/utils/dom.js"></script>
<script src="../../assets/js/utils/ai-file-upload.js"></script>
<script src="../../assets/js/data/storage.js"></script>
<script src="../../assets/js/core/ui.js"></script>
<script src="../../assets/js/core/custom-select.js"></script>
<script src="../../assets/js/core/layout.js"></script>
<script src="../../assets/js/core/pwa.js"></script>
<script src="../../assets/js/modules/ai-flashcard-maker.js"></script>
<script>
  renderShell('ai-flashcard-maker');
  applyTheme();
  initAiFlashcardMaker();
</script>
</body>
</html>
