<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="blue">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notes · Student Planner</title>
<script src="../../assets/js/core/theme.js"></script>
<meta name="theme-color" content="#0F172A">
<link rel="manifest" href="../../manifest.json">
<link rel="icon" href="../../assets/icons/icon-192.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="../../assets/css/main.css" rel="stylesheet">
<link href="../../assets/css/pages/notes.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main-content">

    <!-- NOTES PAGE HEADER -->
    <div class="nt-header fade-in">
      <div class="nt-header-text">
        <h1 class="page-title">Notes</h1>
        <p class="page-sub">Markdown notes with formatting, pins, favorites &amp; checklists</p>
      </div>
      <button class="btn btn-accent nt-add-btn" onclick="openNoteModal()" aria-label="Add new note"><i class="bi bi-plus-lg me-1"></i>Add Note</button>
    </div>

    <!-- NOTES CONTROLS -->
    <div class="nt-controls glass card-pad mb-3 fade-in">
      <!-- Row 1: search · select · fav -->
      <div class="nt-controls-row">
        <div class="nt-search-wrap">
          <i class="bi bi-search nt-search-icon" aria-hidden="true"></i>
          <input class="form-control nt-search-input" id="noteSearch" placeholder="Search notes…" autocomplete="off" aria-label="Search notes">
        </div>
        <button class="nt-icon-btn nt-select-icon-btn" id="ntSelectBtn" onclick="toggleSelectMode()" title="Select notes" aria-label="Select notes">
          <i class="bi bi-check2-square"></i>
        </button>
        <button class="nt-icon-btn" id="favFilterBtn" onclick="toggleFavFilter()" title="Favorites only" aria-label="Filter favorites">
          <i class="bi bi-star"></i>
        </button>
      </div>
      <!-- Row 2: filters + select-all (only in select mode) -->
      <div class="nt-controls-row2">
        <div class="nt-filters-row">
          <div class="dropdown nt-dd" id="noteCatFilterDd">
            <button class="btn btn-ghost nt-dd-btn" id="noteCatFilterBtn" type="button" data-bs-toggle="dropdown" data-bs-auto-close="true" aria-expanded="false" aria-label="Filter by category">
              <i class="bi bi-tags nt-dd-icon" id="noteCatFilterIcon" aria-hidden="true"></i><span class="nt-dd-label" id="noteCatFilterLabel">Filter by category</span><i class="bi bi-chevron-down nt-dd-caret" aria-hidden="true"></i>
            </button>
            <div class="dropdown-menu nt-dd-menu" id="noteCatFilterMenu" aria-label="Filter by category"></div>
            <select class="d-none" id="noteCatFilter" aria-hidden="true" tabindex="-1">
              <option value="">All Categories</option>
              <option>Homework</option>
              <option>Lecture</option>
              <option>Project</option>
              <option>Personal</option>
              <option>Organization</option>
              <option>Ideas</option>
            </select>
          </div>
          <div class="dropdown nt-dd" id="noteLinkFilterSelDd">
            <button class="btn btn-ghost nt-dd-btn" id="noteLinkFilterSelBtn" type="button" data-bs-toggle="dropdown" data-bs-auto-close="true" aria-expanded="false" aria-label="Filter by link type">
              <i class="bi bi-journal-text nt-dd-icon" id="noteLinkFilterSelIcon" aria-hidden="true"></i><span class="nt-dd-label" id="noteLinkFilterSelLabel">Filter by link type</span><i class="bi bi-chevron-down nt-dd-caret" aria-hidden="true"></i>
            </button>
            <div class="dropdown-menu nt-dd-menu" id="noteLinkFilterSelMenu" aria-label="Filter by link type"></div>
            <select class="d-none" id="noteLinkFilterSel" aria-hidden="true" tabindex="-1">
              <option value="all">All Notes</option>
              <option value="subject">By Subject</option>
              <option value="task">By Task</option>
              <option value="unlinked">Unlinked</option>
            </select>
          </div>
          <div class="dropdown nt-dd" id="noteSubFilterSelDd" style="display:none">
            <button class="btn btn-ghost nt-dd-btn" id="noteSubFilterSelBtn" type="button" data-bs-toggle="dropdown" data-bs-auto-close="true" aria-expanded="false" aria-label="Filter by subject">
              <i class="bi bi-book nt-dd-icon" id="noteSubFilterSelIcon" aria-hidden="true"></i><span class="nt-dd-label" id="noteSubFilterSelLabel">Filter by subject</span><i class="bi bi-chevron-down nt-dd-caret" aria-hidden="true"></i>
            </button>
            <div class="dropdown-menu nt-dd-menu" id="noteSubFilterSelMenu" aria-label="Filter by subject"></div>
            <select class="d-none" id="noteSubFilterSel" aria-hidden="true" tabindex="-1"><option value="">All Subjects</option></select>
          </div>
          <div class="dropdown nt-dd" id="noteTaskFilterSelDd" style="display:none">
            <button class="btn btn-ghost nt-dd-btn" id="noteTaskFilterSelBtn" type="button" data-bs-toggle="dropdown" data-bs-auto-close="true" aria-expanded="false" aria-label="Filter by task">
              <i class="bi bi-list-check nt-dd-icon" id="noteTaskFilterSelIcon" aria-hidden="true"></i><span class="nt-dd-label" id="noteTaskFilterSelLabel">Filter by task</span><i class="bi bi-chevron-down nt-dd-caret" aria-hidden="true"></i>
            </button>
            <div class="dropdown-menu nt-dd-menu" id="noteTaskFilterSelMenu" aria-label="Filter by task"></div>
            <select class="d-none" id="noteTaskFilterSel" aria-hidden="true" tabindex="-1"><option value="">All Tasks</option></select>
          </div>
        </div>
      </div>
    </div>

    <!-- Hidden wrappers kept for JS compatibility -->
    <div id="noteSubFilterWrap" style="display:none"></div>
    <div id="noteTaskFilterWrap" style="display:none"></div>

    <div id="notesGrid" class="nt-masonry-grid stagger"></div>
  </main>
</div>

<!-- ADD/EDIT NOTE MODAL -->
<div class="modal fade" id="noteModal" tabindex="-1" aria-modal="true" role="dialog">
  <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title" id="noteModalTitle">New Note</h5><button class="btn-close" aria-label="Close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body" id="noteModalBody"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/utils/dates.js"></script>
<script src="../../assets/js/utils/dom.js"></script>
<script src="../../assets/js/data/storage.js"></script>
<script src="../../assets/js/core/ui.js"></script>
<script src="../../assets/js/core/layout.js"></script>
<script src="../../assets/js/core/pwa.js"></script>
<script src="../../assets/js/modules/notes.js"></script>
<script>
  renderShell('notes');
  applyTheme();
  initNotes();
</script>
</body>
</html>
