<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="blue">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Report · Student Planner</title>
<script src="../../assets/js/core/theme.js"></script>
<meta name="theme-color" content="#0F172A">
<link rel="manifest" href="../../manifest.json">
<link rel="icon" href="../../assets/icons/icon-192.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="../../assets/css/main.css" rel="stylesheet">
<link href="../../assets/css/pages/admin.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main-content">
    <div class="topbar"><div><h1 class="page-title">Report a problem</h1><p class="page-sub">Tell the QCU Planner admins what went wrong.</p></div></div>

    <div id="rpSignInNotice" class="inbox-backend-notice" role="status" hidden>
      <i class="bi bi-box-arrow-in-right" aria-hidden="true"></i>
      <span>Sign in to submit a report and see your report history. <a href="../auth/login.html">Sign in</a></span>
    </div>

    <div class="row g-3">
      <div class="col-12 col-lg-6">
        <div class="glass card-pad fade-in h-100">
          <div class="section-title"><i class="bi bi-flag"></i>Describe the issue</div>
          <form id="reportForm" class="row g-2" novalidate>
            <div class="col-12">
              <label for="rpCategory" class="adm-label">Category</label>
              <select class="form-select" id="rpCategory" required>
                <option value="account">Account or Login Issue</option>
                <option value="data">Incorrect or Missing Data</option>
                <option value="schedule">Schedule or Calendar Issue</option>
                <option value="tasks_grades">Tasks or Grades Issue</option>
                <option value="technical" selected>Technical Problem</option>
                <option value="feature_request">Feature Request</option>
                <option value="other">Other</option>
              </select>
            </div>
            <div class="col-12">
              <label for="rpSubject" class="adm-label">Subject</label>
              <input class="form-control" id="rpSubject" maxlength="150" required placeholder="e.g. Tasks not saving on Calendar page">
              <p class="auth-error" id="rpSubjectError" hidden></p>
            </div>
            <div class="col-12">
              <label for="rpDetails" class="adm-label">What happened?</label>
              <textarea class="form-control" id="rpDetails" rows="6" maxlength="4000" required placeholder="What you were doing, what you expected, and what happened instead."></textarea>
              <p class="auth-error" id="rpDetailsError" hidden></p>
            </div>
            <div class="col-12 mt-2">
              <button type="submit" class="btn btn-accent" id="rpSubmitBtn"><i class="bi bi-send me-1"></i>Send report</button>
            </div>
          </form>
        </div>
      </div>

      <div class="col-12 col-lg-6">
        <div class="glass card-pad fade-in h-100">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <div class="section-title mb-0"><i class="bi bi-clock-history"></i>Your reports</div>
            <span class="text-faint" id="rpCount" aria-live="polite"></span>
          </div>
          <div id="rpLoading" class="adm-loading"><i class="bi bi-hourglass-split"></i> Loading…</div>
          <div class="adm-table-wrap">
            <table class="adm-table">
              <thead><tr><th scope="col">Ticket</th><th scope="col">Subject</th><th scope="col">Category</th><th scope="col">Submitted</th><th scope="col">Status</th></tr></thead>
              <tbody id="rpHistoryBody"></tbody>
            </table>
          </div>
          <div id="rpHistoryEmpty" class="empty-state" hidden>You haven't submitted any reports yet.</div>
          <div id="rpHistoryError" hidden></div>
        </div>
      </div>
    </div>

  </main>
</div>

<!-- Report Details modal -->
<div class="modal fade" id="reportDetailModal" tabindex="-1" aria-modal="true" role="dialog" aria-labelledby="rpDetailTitle">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content card-pad">
      <div class="d-flex justify-content-between align-items-start mb-2">
        <h5 id="rpDetailTitle" class="mb-0">Report details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div id="rpDetailBody"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../../assets/js/utils/dates.js"></script>
<script src="../../assets/js/utils/dom.js"></script>
<script src="../../assets/js/data/storage.js"></script>
<script src="../../assets/js/core/ui.js"></script>
<script src="../../assets/js/core/custom-select.js"></script>
<script src="../../assets/js/core/layout.js"></script>
<script src="../../assets/js/core/pwa.js"></script>
<script>renderShell('report');</script>
<script type="module" src="../../assets/js/modules/student-report.js"></script>
</body>
</html>
