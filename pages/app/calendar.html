<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="blue">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calendar · QCU Student Planner</title>
<script src="../../assets/js/core/app-guard.js"></script>
<script src="../../assets/js/core/theme.js"></script>
<meta name="theme-color" content="#0F172A">
<link rel="manifest" href="../../manifest.json">
<link rel="icon" href="../../assets/icons/icon-192.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../../assets/css/main.css" rel="stylesheet">
<link href="../../assets/css/pages/calendar.css" rel="stylesheet">
<link href="../../assets/css/pages/schedule.css" rel="stylesheet">
<link href="../../assets/css/pages/tasks.css" rel="stylesheet">
<script src="../../assets/js/core/icons.js"></script>
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main-content calendar-page">
    <div class="topbar">
      <div><h1 class="page-title">Calendar</h1><p class="page-sub" id="calSubtitle">Classes, tasks, and events in one place</p></div>
    </div>

    <!-- CALENDAR LAYOUT: two-column on desktop, stacked on mobile -->
    <div class="cal-layout">

      <!-- LEFT / MAIN COLUMN -->
      <div class="cal-main-col">
        <div class="glass card-pad mb-3 fade-in">

          <!-- Toolbar Row 1: [prev] [date] [next + add] -->
          <div class="cal-toolbar-row1">
            <button class="btn-icon" onclick="navCal(-1)" aria-label="Previous"><i class="icon-lucide-chevron-left" aria-hidden="true"></i></button>
            <h4 class="mb-0 cal-title-text" id="calTitle"></h4>
            <div class="cal-nav-right">
              <button class="btn-icon" onclick="navCal(1)" aria-label="Next"><i class="icon-lucide-chevron-right" aria-hidden="true"></i></button>
              <div class="dropdown">
                <button class="btn btn-accent btn-sm dropdown-toggle" data-bs-toggle="dropdown" aria-label="Add event"><i class="icon-lucide-plus me-1" aria-hidden="true"></i>Add</button>
                <ul class="dropdown-menu dropdown-menu-end">
                  <li><a class="dropdown-item" href="#" onclick="openCalEventModal();return false;"><i class="icon-lucide-calendar-days me-2" aria-hidden="true"></i>One-off Event</a></li>
                  <li><a class="dropdown-item" href="#" onclick="openTaskModal();return false;"><i class="icon-lucide-list-check me-2" aria-hidden="true"></i>Task</a></li>
                  <li><a class="dropdown-item" href="#" onclick="openSubjectModal();return false;"><i class="icon-lucide-calendar-days me-2" aria-hidden="true"></i>Class Schedule</a></li>
                </ul>
              </div>
            </div>
          </div>

          <!-- Toolbar Row 2: view toggle + today/search/export + filter — all in one row -->
          <div class="cal-toolbar-row2">
            <div class="cal-view-bar" role="group" aria-label="Calendar view">
              <button class="cal-view-btn active" data-mode="month" onclick="setCalMode('month')" aria-pressed="true">Month</button>
              <button class="cal-view-btn" data-mode="week" onclick="setCalMode('week')" aria-pressed="false">Week</button>
              <button class="cal-view-btn" data-mode="day" onclick="setCalMode('day')" aria-pressed="false">Day</button>
            </div>
            <div class="cal-toolbar-actions">
              <button class="btn btn-ghost btn-sm" onclick="goToToday()" aria-label="Go to today"><i class="icon-lucide-corner-down-left" aria-hidden="true"></i></button>
              <div class="dropdown">
                <button class="btn btn-ghost btn-sm" data-bs-toggle="dropdown" aria-label="Jump to date" id="jumpDateBtn"><i class="icon-lucide-search" aria-hidden="true"></i></button>
                <div class="dropdown-menu dropdown-menu-end p-2" style="min-width:220px">
                  <label class="form-label mb-1" style="font-size:.75rem;font-weight:700">Jump to Date</label>
                  <div class="d-flex gap-2">
                    <input type="date" class="form-control form-control-sm" id="jumpDateInput" aria-label="Select date to jump to">
                    <button class="btn btn-accent btn-sm" onclick="doJumpDate()">Go</button>
                  </div>
                </div>
              </div>
              <div class="dropdown">
                <button class="btn btn-ghost btn-sm" data-bs-toggle="dropdown" aria-label="Export calendar"><i class="icon-lucide-share" aria-hidden="true"></i></button>
                <ul class="dropdown-menu dropdown-menu-end">
                  <li><h6 class="dropdown-header">Export Calendar</h6></li>
                  <li><a class="dropdown-item" href="#" onclick="exportICS();return false;"><i class="icon-lucide-file-text me-2" aria-hidden="true"></i>Download .ics</a></li>
                  <li><a class="dropdown-item" href="#" onclick="exportGoogleCalendar();return false;"><i class="icon-lucide-school me-2" aria-hidden="true"></i>Google Calendar</a></li>
                </ul>
              </div>
              <div class="dropdown">
                <button class="cal-filter-toggle-btn" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Filter events" id="filterToggleBtn">
                  <i class="icon-lucide-list-filter" aria-hidden="true"></i>
                  <span class="cal-filter-active-count" id="filterActiveCount" aria-live="polite"></span>
                </button>
                <div class="dropdown-menu cal-filter-dropdown dropdown-menu-end p-2" aria-label="Event filters">
                  <div class="cal-filter-header mb-2">Show on Calendar</div>
                  <div class="cal-filter-checks">
                    <label class="cal-filter-check-item" id="filter-classes" onclick="toggleFilter('classes');return false;">
                      <span class="cal-filter-dot" style="background:#7C6CF6"></span>
                      <span>Classes</span>
                      <i class="icon-lucide-check cal-filter-check-icon ms-auto" aria-hidden="true"></i>
                    </label>
                    <label class="cal-filter-check-item" id="filter-tasks" onclick="toggleFilter('tasks');return false;">
                      <span class="cal-filter-dot" style="background:#B45309"></span>
                      <span>Tasks</span>
                      <i class="icon-lucide-check cal-filter-check-icon ms-auto" aria-hidden="true"></i>
                    </label>
                    <label class="cal-filter-check-item" id="filter-events" onclick="toggleFilter('events');return false;">
                      <span class="cal-filter-dot" style="background:#34D399"></span>
                      <span>Events</span>
                      <i class="icon-lucide-check cal-filter-check-icon ms-auto" aria-hidden="true"></i>
                    </label>
                    <label class="cal-filter-check-item" id="filter-univ" onclick="toggleFilter('univ');return false;">
                      <span class="cal-filter-dot" style="background:#4F8CFF"></span>
                      <span>University</span>
                      <i class="icon-lucide-check cal-filter-check-icon ms-auto" aria-hidden="true"></i>
                    </label>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Calendar body -->
          <div id="calBody" aria-busy="true"><div class="skel skel-block" style="height:380px" aria-hidden="true"></div></div>
        </div>
      </div>

      <!-- RIGHT / AGENDA COLUMN (desktop side panel, mobile below) -->
      <div class="cal-agenda-col">
        <div class="glass card-pad fade-in cal-agenda-panel">
          <div class="cal-agenda-header" id="calAgendaHeader">
            <i class="icon-lucide-calendar-days" aria-hidden="true"></i>
            <span id="calAgendaTitle">Agenda</span>
          </div>
          <div id="calAgendaBody"></div>
        </div>
      </div>

    </div><!-- end cal-layout -->

  </main>
</div>

<!-- One-off Event Modal -->
<div class="modal fade" id="calEventModal" tabindex="-1" aria-modal="true" role="dialog">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-body card-pad" id="calEventModalBody"></div>
    </div>
  </div>
</div>

<!-- University Event Modal -->
<div class="modal fade" id="univEventModal" tabindex="-1" aria-modal="true" role="dialog" aria-labelledby="univEventModalTitle">
  <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header uev-detail-head">
        <h5 class="modal-title" id="univEventModalTitle"><i class="icon-lucide-landmark me-2" aria-hidden="true"></i>Event</h5>
        <button class="btn-close" aria-label="Close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="univEventModalBody"></div>
    </div>
  </div>
</div>

<!-- Day Detail Modal (mobile fallback) -->
<div class="modal fade" id="dayModal" tabindex="-1" aria-modal="true" role="dialog">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-body card-pad" id="dayModalBody"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../../assets/js/utils/dates.js"></script>
<script src="../../assets/js/utils/dom.js"></script>
<script src="../../assets/js/utils/event-details.js"></script>
<script src="../../assets/js/data/storage.js"></script>
<script src="../../assets/js/core/notification-engine.js"></script>
<script src="../../assets/js/data/cloud-sync.js"></script>
<script src="../../assets/js/core/ui.js"></script>
<script src="../../assets/js/core/custom-select.js"></script>
<script src="../../assets/js/services/task-stats.js"></script>
<script src="../../assets/js/core/layout.js"></script>
<script src="../../assets/js/core/pwa.js"></script>
<script src="../../assets/js/core/time-field.js"></script>
<script src="../../assets/js/shared/subject-modal.js"></script>
<script src="../../assets/js/shared/task-modal.js"></script>
<script src="../../assets/js/modules/calendar.js"></script>
<script>
  renderShell('calendar');
  applyTheme();
  DB.whenCloudReady(initCalendar);
</script>
<script src="../../assets/js/core/date-picker.js"></script>
</body>
</html>
