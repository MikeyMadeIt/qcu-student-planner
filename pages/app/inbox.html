<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="blue">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inbox · Student Planner</title>
<script src="../../assets/js/core/theme.js"></script>
<meta name="theme-color" content="#0F172A">
<link rel="manifest" href="../../manifest.json">
<link rel="icon" href="../../assets/icons/icon-192.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="../../assets/css/main.css" rel="stylesheet">
<link href="../../assets/css/pages/inbox.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main-content">
    <div class="topbar">
      <div>
        <h1 class="page-title">Inbox</h1>
        <p class="page-sub">Messages from your administrators.</p>
      </div>
    </div>

    <div class="inbox-backend-notice" role="status">
      <i class="bi bi-info-circle" aria-hidden="true"></i>
      <span>This is a one-way inbox: administrators can send you messages here, but you cannot reply from this page.</span>
    </div>

    <section class="glass card-pad" aria-label="Inbox">
      <label class="inbox-search">
        <i class="bi bi-search" aria-hidden="true"></i>
        <input id="inboxSearch" class="form-control" type="search" placeholder="Search messages" autocomplete="off" aria-label="Search messages">
      </label>
      <div class="inbox-filter-row">
        <button type="button" class="btn btn-ghost btn-sm active" id="inboxFilterAll" data-filter="all">All</button>
        <button type="button" class="btn btn-ghost btn-sm" id="inboxFilterUnread" data-filter="unread">Unread</button>
      </div>
      <div id="inboxLoading" class="adm-loading" hidden><i class="bi bi-hourglass-split"></i> Loading…</div>
      <div class="msg-list-empty" id="inboxListState" role="status" aria-live="polite" hidden>
        <i class="bi bi-chat-square-text" aria-hidden="true"></i>
        <strong>No messages</strong>
        <span>When an administrator sends you a message, it will appear here.</span>
      </div>
      <div id="inboxList" class="msg-list" hidden></div>
      <div class="inbox-pagination" id="inboxPagination" hidden></div>
    </section>
  </main>
</div>

<!-- Message detail modal -->
<div class="modal fade" id="messageDetailModal" tabindex="-1" aria-modal="true" role="dialog" aria-labelledby="msgDetailTitle">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content card-pad">
      <div class="d-flex justify-content-between align-items-start mb-2">
        <h5 id="msgDetailTitle" class="mb-0">Message details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div id="msgDetailBody"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../../assets/js/utils/dates.js"></script>
<script src="../../assets/js/utils/dom.js"></script>
<script src="../../assets/js/data/storage.js"></script>
<script src="../../assets/js/core/ui.js"></script>
<script src="../../assets/js/core/custom-select.js"></script>
<script src="../../assets/js/core/layout.js"></script>
<script src="../../assets/js/core/pwa.js"></script>
<script>renderShell('inbox');</script>
<script type="module" src="../../assets/js/modules/student-inbox.js"></script>
</body>
</html>
