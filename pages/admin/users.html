<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="blue">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>User Management · QCU Student Planner</title>
<script src="../../assets/js/core/theme.js"></script>
<meta name="theme-color" content="#0F172A">
<link rel="manifest" href="../../manifest.json">
<link rel="icon" href="../../assets/icons/icon-192.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="../../assets/css/main.css" rel="stylesheet">
<link href="../../assets/css/pages/admin.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main-content">
    <div class="topbar adm-topbar">
      <a class="shell-brand adm-topbar-brand" href="dashboard.html" aria-label="QCU Planner admin">
        <span class="dot"><i class="bi bi-mortarboard" aria-hidden="true"></i></span>
        <span>QCU Planner<small>Admin</small></span>
      </a>
      <div class="topbar-controls">
        <div class="theme-switch" role="radiogroup" aria-label="Theme" data-theme-switch></div>
        <button type="button" class="shell-menu-btn" data-sidebar-toggle aria-label="Toggle sidebar"><i class="bi bi-list" aria-hidden="true"></i></button>
      </div>
    </div>

    <div class="topbar"><div><h1 class="page-title">User Management</h1><p class="page-sub">All registered accounts, after review</p></div></div>

    <div class="glass card-pad mb-3">
      <div class="adm-filters">
        <div>
          <label for="admSearch" class="adm-label">Search</label>
          <input id="admSearch" class="form-control" type="search" placeholder="Name, student no. or program" autocomplete="off">
        </div>
        <div><label for="admStatus" class="adm-label">Status</label>
          <select id="admStatus" class="form-select">
            <option value="all">All</option>
            <option value="approved">Approved</option>
            <option value="pending">Pending</option>
            <option value="rejected">Rejected</option>
            <option value="suspended">Suspended</option>
          </select></div>
      </div>
    </div>

    <div class="glass card-pad">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <div class="section-title mb-0"><i class="bi bi-people-fill"></i>Accounts</div>
        <span class="text-faint" id="admCount" aria-live="polite"></span>
      </div>
      <div id="admLoading" class="adm-loading"><i class="bi bi-hourglass-split"></i> Loading…</div>
      <div class="adm-table-wrap">
        <table class="adm-table">
          <thead><tr><th scope="col">Account</th><th scope="col">Role</th><th scope="col">Registered</th><th scope="col">Status</th><th scope="col" class="text-end">Actions</th></tr></thead>
          <tbody id="admBody"></tbody>
        </table>
      </div>
      <div id="admEmpty" class="empty-state" hidden>No accounts match your filters.</div>
      <div class="adm-pagination" id="admPagination" hidden></div>
    </div>
  </main>
</div>

<div class="modal fade" id="userDetailModal" tabindex="-1" aria-modal="true" role="dialog" aria-labelledby="userDetailTitle">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content card-pad">
      <div class="d-flex justify-content-between align-items-start mb-2">
        <h5 id="userDetailTitle" class="mb-0">Account details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <dl class="adm-detail-grid" id="userDetailBody"></dl>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../../assets/js/utils/dates.js"></script>
<script src="../../assets/js/utils/dom.js"></script>
<script src="../../assets/js/data/storage.js"></script>
<script src="../../assets/js/core/ui.js"></script>
<script src="../../assets/js/core/layout.js"></script>
<script src="../../assets/js/core/pwa.js"></script>
<script type="module" src="../../assets/js/modules/admin-users.js"></script>
</body>
</html>
