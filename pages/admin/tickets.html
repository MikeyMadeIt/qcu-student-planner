<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="blue">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Support Tickets · QCU Student Planner</title>
<script src="../../assets/js/core/theme.js"></script>
<meta name="theme-color" content="#0F172A">
<link rel="manifest" href="../../manifest.json">
<link rel="icon" href="../../assets/icons/icon-192.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="../../assets/css/main.css" rel="stylesheet">
<link href="../../assets/css/pages/admin.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main-content">

    <div class="glass card-pad mb-3">
      <div class="adm-filters">
        <div class="adm-filter-search">
          <label for="admSearch" class="adm-label">Search</label>
          <input id="admSearch" class="form-control" type="search" placeholder="Search by ticket reference, subject or student email" autocomplete="off">
        </div>
        <div class="adm-filters-row">
          <div>
            <label for="admStatus" class="adm-label">Status</label>
            <select id="admStatus" class="form-select">
              <option value="all">All statuses</option>
              <option value="open">Open</option>
              <option value="in_progress">In Progress</option>
              <option value="waiting_user">Waiting for User</option>
              <option value="resolved">Resolved</option>
              <option value="closed">Closed</option>
            </select>
          </div>
          <div>
            <label for="admCategory" class="adm-label">Category</label>
            <select id="admCategory" class="form-select">
              <option value="all">All categories</option>
              <option value="account">Account or Login Issue</option>
              <option value="data">Incorrect or Missing Data</option>
              <option value="schedule">Schedule or Calendar Issue</option>
              <option value="tasks_grades">Tasks or Grades Issue</option>
              <option value="technical">Technical Problem</option>
              <option value="feature_request">Feature Request</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div>
            <label for="admSort" class="adm-label">Sort by</label>
            <select id="admSort" class="form-select">
              <option value="created_desc">Newest first</option>
              <option value="created_asc">Oldest first</option>
            </select>
          </div>
          <button type="button" id="admFiltersClear" class="btn btn-ghost adm-filters-clear">
            <i class="bi bi-x-circle" aria-hidden="true"></i> Clear filters
          </button>
        </div>
      </div>
    </div>

    <div class="glass card-pad">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <div class="section-title mb-0"><i class="bi bi-life-preserver"></i>Support tickets</div>
        <span class="text-faint" id="admCount" aria-live="polite"></span>
      </div>
      <div id="admLoading" class="adm-loading"><i class="bi bi-hourglass-split"></i> Loading…</div>
      <div class="adm-table-wrap">
        <table class="adm-table">
          <thead><tr>
            <th scope="col">Ticket</th>
            <th scope="col">Student</th>
            <th scope="col">Subject</th>
            <th scope="col">Category</th>
            <th scope="col">Status</th>
            <th scope="col">Submitted</th>
            <th scope="col">Updated</th>
            <th scope="col" class="text-end">Actions</th>
          </tr></thead>
          <tbody id="admBody"></tbody>
        </table>
      </div>
      <div id="admEmpty" class="empty-state" hidden>No support tickets match your filters.</div>
      <div id="admError" hidden></div>
      <div class="adm-pagination" id="admPagination" hidden></div>
    </div>
  </main>
</div>

<!-- Ticket Details modal -->
<div class="modal fade" id="ticketDetailModal" tabindex="-1" aria-modal="true" role="dialog" aria-labelledby="tkDetailTitle">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content card-pad">
      <div class="d-flex justify-content-between align-items-start mb-2">
        <h5 id="tkDetailTitle" class="mb-0">Ticket details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div id="tkDetailBody"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../../assets/js/utils/dates.js"></script>
<script src="../../assets/js/utils/dom.js"></script>
<script src="../../assets/js/data/storage.js"></script>
<script src="../../assets/js/core/ui.js"></script>
<script src="../../assets/js/core/custom-select.js"></script>
<script src="../../assets/js/core/layout.js"></script>
<script src="../../assets/js/core/pwa.js"></script>
<script type="module" src="../../assets/js/modules/admin-tickets.js"></script>
</body>
</html>
