<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="blue">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Inbox · QCU Student Planner</title>
<script src="../../assets/js/core/theme.js"></script>
<meta name="theme-color" content="#0F172A">
<link rel="manifest" href="../../manifest.json">
<link rel="icon" href="../../assets/icons/icon-192.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="../../assets/css/main.css" rel="stylesheet">
<link href="../../assets/css/pages/admin.css" rel="stylesheet">
<link href="../../assets/css/pages/inbox.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main-content">

    <div class="glass card-pad mb-3">
      <div class="adm-filters">
        <div class="adm-filter-search">
          <label for="admSearch" class="adm-label">Search</label>
          <input id="admSearch" class="form-control" type="search" placeholder="Search by subject or message content" autocomplete="off">
        </div>
        <div class="adm-filters-row">
          <div>
            <label for="admCategory" class="adm-label">Category</label>
            <select id="admCategory" class="form-select">
              <option value="all">All categories</option>
              <option value="announcement">Announcement</option>
              <option value="update">Update</option>
              <option value="reminder">Reminder</option>
              <option value="maintenance">Maintenance</option>
              <option value="general">General</option>
            </select>
          </div>
          <div>
            <label for="admDateFrom" class="adm-label">Sent from</label>
            <input id="admDateFrom" class="form-control" type="date">
          </div>
          <div>
            <label for="admDateTo" class="adm-label">Sent to</label>
            <input id="admDateTo" class="form-control" type="date">
          </div>
          <div>
            <label for="admSort" class="adm-label">Sort by</label>
            <select id="admSort" class="form-select">
              <option value="sent_desc">Newest first</option>
              <option value="sent_asc">Oldest first</option>
            </select>
          </div>
          <button type="button" id="admFiltersClear" class="btn btn-ghost adm-filters-clear">
            <i class="bi bi-x-circle" aria-hidden="true"></i> Clear filters
          </button>
        </div>
      </div>
    </div>

    <div class="glass card-pad">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <div class="section-title mb-0"><i class="bi bi-inbox"></i>Sent messages</div>
        <div class="d-flex align-items-center gap-2">
          <span class="text-faint" id="admCount" aria-live="polite"></span>
          <button type="button" class="btn btn-accent btn-sm" id="composeBtn" data-bs-toggle="modal" data-bs-target="#composeModal">
            <i class="bi bi-pencil-square"></i> Compose message
          </button>
        </div>
      </div>
      <div id="admLoading" class="adm-loading"><i class="bi bi-hourglass-split"></i> Loading…</div>
      <div class="msg-list" id="admBody" hidden></div>
      <div id="admEmpty" class="empty-state" hidden>No messages have been sent yet.</div>
      <div id="admError" hidden></div>
      <div class="inbox-pagination" id="admPagination" hidden></div>
    </div>
  </main>
</div>

<!-- Compose Message modal -->
<div class="modal fade" id="composeModal" tabindex="-1" aria-modal="true" role="dialog" aria-labelledby="composeTitle">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content card-pad">
      <div class="d-flex justify-content-between align-items-start mb-2">
        <h5 id="composeTitle" class="mb-0"><i class="bi bi-pencil-square"></i> Compose message</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <p class="text-faint" style="font-size:.82rem">Sent to the student's own Inbox. Students can read this message but cannot reply to it.</p>

      <form id="composeForm" novalidate>
        <div class="row g-3">
          <div class="col-12">
            <label for="cmSubject" class="adm-label">Subject</label>
            <input id="cmSubject" class="form-control" maxlength="150" required placeholder="e.g. Midterm schedule reminder">
            <p class="auth-error" id="cmSubjectError" hidden></p>
          </div>
          <div class="col-12 col-sm-6">
            <label for="cmCategory" class="adm-label">Category</label>
            <select id="cmCategory" class="form-select" required>
              <option value="announcement">Announcement</option>
              <option value="update">Update</option>
              <option value="reminder" selected>Reminder</option>
              <option value="maintenance">Maintenance</option>
              <option value="general">General</option>
            </select>
          </div>
          <div class="col-12 col-sm-6">
            <label for="cmScope" class="adm-label">Recipients</label>
            <select id="cmScope" class="form-select">
              <option value="all">All approved students</option>
              <option value="selected">Selected students</option>
              <option value="single">One specific student</option>
            </select>
          </div>
          <div class="col-12" id="cmRecipientPickerWrap" hidden>
            <label class="adm-label">Choose student(s)</label>
            <input id="cmRecipientSearch" class="form-control mb-2" type="search" placeholder="Search students by name or email" autocomplete="off">
            <div class="adm-recipient-list" id="cmRecipientList" role="group" aria-label="Students"></div>
            <p class="text-faint mt-1" style="font-size:.76rem" id="cmRecipientCount">0 selected</p>
            <p class="auth-error" id="cmRecipientError" hidden></p>
          </div>
          <div class="col-12">
            <label for="cmBody" class="adm-label">Message</label>
            <textarea id="cmBody" class="form-control" rows="6" maxlength="4000" required placeholder="Write your message…"></textarea>
            <p class="auth-error" id="cmBodyError" hidden></p>
          </div>
        </div>

        <div class="d-flex justify-content-end gap-2 mt-3">
          <button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-accent" id="cmSendBtn"><i class="bi bi-send"></i> Send message</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Message Details modal -->
<div class="modal fade" id="messageDetailModal" tabindex="-1" aria-modal="true" role="dialog" aria-labelledby="msgDetailTitle">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content card-pad">
      <div class="d-flex justify-content-between align-items-start mb-2">
        <h5 id="msgDetailTitle" class="mb-0">Message details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div id="msgDetailBody"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../../assets/js/utils/dates.js"></script>
<script src="../../assets/js/utils/dom.js"></script>
<script src="../../assets/js/data/storage.js"></script>
<script src="../../assets/js/core/ui.js"></script>
<script src="../../assets/js/core/custom-select.js"></script>
<script src="../../assets/js/core/layout.js"></script>
<script src="../../assets/js/core/pwa.js"></script>
<script type="module" src="../../assets/js/modules/admin-inbox.js"></script>
</body>
</html>
