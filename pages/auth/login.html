<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="blue">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <title>Log in · QCU Student Planner</title>
    <script src="../../assets/js/core/theme.js"></script>
    <meta name="theme-color" content="#0F172A">
    <link rel="manifest" href="../../manifest.json">
    <link rel="icon" href="../../assets/icons/icon-192.png">
    <link rel="apple-touch-icon" href="../../assets/icons/icon-192.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../../assets/css/main.css" rel="stylesheet">
    <link href="../../assets/css/pages/auth.css" rel="stylesheet">
</head>
<body class="auth-page">
    <div class="grid-bg" aria-hidden="true"></div>

    <button type="button" class="theme-toggle" data-theme-toggle aria-label="Switch to light theme">
        <i class="bi bi-sun theme-icon-sun" aria-hidden="true"></i>
        <i class="bi bi-moon-stars theme-icon-moon" aria-hidden="true"></i>
    </button>

    <main class="auth-main" id="main">
        <div class="auth-card">
            <a class="auth-brand" href="login.html">
                <img src="../../assets/images/branding/qcu-logo.webp" alt="">
                <span>QCU Student Planner<small>Student portal</small></span>
            </a>

            <h1 class="auth-title">Welcome back</h1>
            <p class="auth-sub">Log in to see your schedule, tasks and grades.</p>

            <form data-auth-form="login" novalidate>
                <div class="auth-alert error" data-alert role="alert" hidden></div>

                <div class="auth-field">
                    <label for="email">Personal Email</label>
                    <input class="form-control" id="email" name="email" type="email" autocomplete="username" inputmode="email" placeholder="name@example.com" data-rule="email" aria-describedby="email-err" aria-invalid="false">
                    <p class="auth-error" id="email-err" hidden></p>
                </div>

                <div class="auth-field">
                    <label for="password">Password</label>
                    <div class="pw-wrap">
                        <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" data-rule="password" aria-describedby="password-err" aria-invalid="false">
                        <button type="button" class="pw-toggle" data-toggle-password="password" aria-label="Show password" aria-pressed="false">
                            <i class="bi bi-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                    <p class="auth-error" id="password-err" hidden></p>
                    <a class="auth-link auth-forgot" href="forgot-password.html">Forgot password?</a>
                </div>

                <button class="btn btn-accent auth-submit" type="submit">Log In</button>
            </form>

            <p class="auth-foot">Don't have an account? <a class="auth-link" href="register.html">Sign up</a></p>
        </div>
        <p class="auth-note">Your sign-in is verified securely and your information is kept private.</p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="../../assets/js/core/theme-toggle.js"></script>
    <script type="module" src="../../assets/js/modules/auth.js"></script>
</body>
</html>
