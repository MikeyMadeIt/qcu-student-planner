<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="blue">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <title>Log in · QCU Student Planner</title>
    <script src="../../assets/js/core/theme.js"></script>
    <meta name="theme-color" content="#0F172A">
    <link rel="manifest" href="../../manifest.json">
    <link rel="icon" href="../../assets/icons/icon-192.png">
    <link rel="apple-touch-icon" href="../../assets/icons/icon-192.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../../assets/css/main.css" rel="stylesheet">
    <link href="../../assets/css/pages/auth.css" rel="stylesheet">
</head>
<body class="auth-page">
    <div class="grid-bg" aria-hidden="true"></div>

    <button type="button" class="theme-toggle" data-theme-toggle aria-label="Switch to light theme">
        <i class="bi bi-sun theme-icon-sun" aria-hidden="true"></i>
        <i class="bi bi-moon-stars theme-icon-moon" aria-hidden="true"></i>
    </button>

    <main class="auth-main" id="main">
        <div class="auth-card">
            <a class="auth-brand" href="login.html">
                <img src="../../assets/images/branding/qcu-logo.webp" alt="">
                <span>QCU Student Planner<small>Student portal</small></span>
            </a>

            <h1 class="auth-title">Welcome back</h1>
            <p class="auth-sub">Log in to see your schedule, tasks and grades.</p>

            <form data-auth-form="login" novalidate>
                <div class="auth-alert error" data-alert role="alert" hidden></div>

                <div class="auth-field">
                    <label for="email">Personal Email</label>
                    <input class="form-control" id="email" name="email" type="email" autocomplete="username" inputmode="email" placeholder="name@example.com" data-rule="email" aria-describedby="email-err" aria-invalid="false">
                    <p class="auth-error" id="email-err" hidden></p>
                </div>

                <div class="auth-field">
                    <label for="password">Password</label>
                    <div class="pw-wrap">
                        <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" data-rule="password" aria-describedby="password-err" aria-invalid="false">
                        <button type="button" class="pw-toggle" data-toggle-password="password" aria-label="Show password" aria-pressed="false">
                            <i class="bi bi-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                    <p class="auth-error" id="password-err" hidden></p>
                    <a class="auth-link auth-forgot" href="forgot-password.html">Forgot password?</a>
                </div>

                <button class="btn btn-accent auth-submit" type="submit">Log In</button>
            </form>

            <div class="auth-divider"><span>or</span></div>

            <button type="button" class="btn btn-google auth-submit" data-google-signin>
                <svg class="google-g" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
                    <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
                    <path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
                    <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
                    <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
                </svg>
                Continue with Google
            </button>

            <p class="auth-foot">Don't have an account? <a class="auth-link" href="register.html">Sign up</a></p>
        </div>
        <p class="auth-note">Your sign-in is verified securely and your information is kept private.</p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="../../assets/js/core/theme-toggle.js"></script>
    <script type="module" src="../../assets/js/modules/auth.js"></script>
</body>
</html>
