<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="amber">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <title>New password · QCU Student Planner</title>
    <script src="../../assets/js/core/theme.js"></script>
    <meta name="theme-color" content="#0F172A">
    <link rel="manifest" href="../../manifest.json">
    <link rel="icon" href="../../assets/icons/icon-192.png">
    <link rel="apple-touch-icon" href="../../assets/icons/icon-192.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../../assets/css/main.css" rel="stylesheet">
    <link href="../../assets/css/pages/auth.css" rel="stylesheet">
</head>
<body class="auth-page">
    <div class="grid-bg" aria-hidden="true"></div>

    <button type="button" class="theme-toggle" data-theme-toggle aria-label="Switch to light theme">
        <i class="bi bi-sun theme-icon-sun" aria-hidden="true"></i>
        <i class="bi bi-moon-stars theme-icon-moon" aria-hidden="true"></i>
    </button>

    <main class="auth-main" id="main">
        <div class="auth-card">
            <a class="auth-brand" href="login.html">
                <img src="../../assets/images/branding/qcu-logo.webp" alt="">
                <span>QCU Student Planner<small>Student portal</small></span>
            </a>

            <h1 class="auth-title">Choose a new password</h1>
            <p class="auth-sub">Create a new password for your account.</p>

            <form data-auth-form="reset" novalidate>
                <div class="auth-alert error" data-alert role="alert" hidden></div>

                <div class="auth-field">
                    <label for="password">New password</label>
                    <div class="pw-wrap">
                        <input class="form-control" id="password" name="password" type="password" autocomplete="new-password" data-rule="newPassword" aria-describedby="password-err" aria-invalid="false">
                        <button type="button" class="pw-toggle" data-toggle-password="password" aria-label="Show password" aria-pressed="false">
                            <i class="bi bi-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                    <p class="auth-error" id="password-err" hidden></p>
                </div>

                <ul class="req-list" data-requirements aria-label="Password requirements"></ul>

                <div class="auth-field">
                    <label for="confirmPassword">Confirm new password</label>
                    <div class="pw-wrap">
                        <input class="form-control" id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" data-rule="confirm" aria-describedby="confirmPassword-err" aria-invalid="false">
                        <button type="button" class="pw-toggle" data-toggle-password="confirmPassword" aria-label="Show password" aria-pressed="false">
                            <i class="bi bi-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                    <p class="auth-error" id="confirmPassword-err" hidden></p>
                </div>

                <button class="btn btn-accent auth-submit" type="submit">Update password</button>
            </form>

            <p class="auth-foot"><a class="auth-link" href="login.html"><i class="bi bi-arrow-left" aria-hidden="true"></i>Back to log in</a></p>
        </div>
        <p class="auth-note">Form checks only help you fix typos. Password changes are completed by the server.</p>
    </main>

    <script src="../../assets/js/core/theme-toggle.js"></script>
    <script type="module" src="../../assets/js/modules/auth.js"></script>
</body>
</html>
