<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="amber">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <title>Verify email · QCU Student Planner</title>
    <script src="../../assets/js/core/theme.js"></script>
    <meta name="theme-color" content="#0F172A">
    <link rel="manifest" href="../../manifest.json">
    <link rel="icon" href="../../assets/icons/icon-192.png">
    <link rel="apple-touch-icon" href="../../assets/icons/icon-192.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../../assets/css/main.css" rel="stylesheet">
    <link href="../../assets/css/pages/auth.css" rel="stylesheet">
</head>
<body class="auth-page" data-status-page="verify">
    <div class="grid-bg" aria-hidden="true"></div>

    <button type="button" class="theme-toggle" data-theme-toggle aria-label="Switch to light theme">
        <i class="bi bi-sun theme-icon-sun" aria-hidden="true"></i>
        <i class="bi bi-moon-stars theme-icon-moon" aria-hidden="true"></i>
    </button>

    <main class="auth-main" id="main">
        <div class="auth-card">
            <a class="auth-brand" href="login.html">
                <img src="../../assets/images/branding/qcu-logo.webp" alt="">
                <span>QCU Student Planner<small>Student portal</small></span>
            </a>

            <div class="auth-center">
                <div class="status-icon"><i class="bi bi-envelope-check" aria-hidden="true"></i></div>
                <h1 class="auth-title" data-status-title>Verifying your email…</h1>
                <div class="auth-alert info" data-status-message role="status" hidden></div>
                <div class="auth-actions">
                    <a class="btn btn-ghost" href="login.html">Go to log in</a>
                </div>
            </div>
        </div>
        <p class="auth-note">Email verification is completed by the server, not by this page.</p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="../../assets/js/core/theme-toggle.js"></script>
    <script type="module" src="../../assets/js/modules/auth.js"></script>
</body>
</html>
