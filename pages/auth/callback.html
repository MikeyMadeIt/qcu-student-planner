<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="blue">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <title>Signing in · QCU Student Planner</title>
    <script src="../../assets/js/core/theme.js"></script>
    <meta name="theme-color" content="#0F172A">
    <link rel="manifest" href="../../manifest.json">
    <link rel="icon" href="../../assets/icons/icon-192.png">
    <link rel="apple-touch-icon" href="../../assets/icons/icon-192.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../../assets/css/main.css" rel="stylesheet">
    <link href="../../assets/css/pages/auth.css" rel="stylesheet">
<script src="../../assets/js/core/icons.js"></script>
</head>
<body class="auth-page" data-auth-callback>
    <div class="grid-bg" aria-hidden="true"></div>

    <button type="button" class="theme-toggle auth-mobile-theme-toggle" data-theme-toggle aria-label="Switch theme">
        <i class="icon-lucide-sun theme-icon-sun" aria-hidden="true"></i>
        <i class="icon-lucide-moon-star theme-icon-moon" aria-hidden="true"></i>
    </button>

    <main class="auth-main auth-callback-main" id="main">
        <a class="auth-brand auth-callback-brand" href="login.html">
            <img class="app-brand-logo" src="../../images/logo/kyusiyu-student-planner.png" alt="Kyusiyu Student Planner">
        </a>

        <div class="auth-center auth-callback-content">
            <div class="status-icon status-icon-loading" data-callback-spinner>
                <span class="auth-spinner" aria-hidden="true"></span>
            </div>
            <h1 class="auth-title" data-callback-title>Finishing sign-in&hellip;</h1>
            <p class="auth-sub" data-callback-subtitle>Verifying your Google sign-in&hellip;</p>
            <div class="auth-alert error" data-callback-message role="alert" hidden></div>
            <div class="auth-actions" data-callback-actions hidden>
                <a class="btn btn-accent auth-submit" href="login.html">Back to log in</a>
            </div>
        </div>
        <p class="auth-note">Approval is decided by an administrator, never by this page.</p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="../../assets/js/core/theme-toggle.js"></script>
    <script type="module" src="../../assets/js/modules/auth.js"></script>
</body>
</html>
