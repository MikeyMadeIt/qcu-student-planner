<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="amber">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <title>Reset password · QCU Student Planner</title>
    <script src="../../assets/js/core/theme.js"></script>
    <meta name="theme-color" content="#0F172A">
    <link rel="manifest" href="../../manifest.json">
    <link rel="icon" href="../../assets/icons/icon-192.png">
    <link rel="apple-touch-icon" href="../../assets/icons/icon-192.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../../assets/css/main.css" rel="stylesheet">
    <link href="../../assets/css/pages/auth.css" rel="stylesheet">
</head>
<body class="auth-page">
    <div class="grid-bg" aria-hidden="true"></div>

    <button type="button" class="theme-toggle" data-theme-toggle aria-label="Switch to light theme">
        <i class="bi bi-sun theme-icon-sun" aria-hidden="true"></i>
        <i class="bi bi-moon-stars theme-icon-moon" aria-hidden="true"></i>
    </button>

    <main class="auth-main" id="main">
        <div class="auth-card">
            <a class="auth-brand" href="login.html">
                <img src="../../assets/images/branding/qcu-logo.webp" alt="">
                <span>QCU Student Planner<small>Student portal</small></span>
            </a>

            <h1 class="auth-title">Reset your password</h1>
            <p class="auth-sub">Enter your personal email and reset instructions will be sent once the email service is available.</p>

            <form data-auth-form="forgot" novalidate>
                <div class="auth-alert error" data-alert role="alert" hidden></div>

                <div class="auth-field">
                    <label for="email">Personal Email</label>
                    <input class="form-control" id="email" name="email" type="email" autocomplete="email" inputmode="email" placeholder="name@example.com" data-rule="email" aria-describedby="email-err" aria-invalid="false">
                    <p class="auth-error" id="email-err" hidden></p>
                </div>

                <button class="btn btn-accent auth-submit" type="submit">Send reset link</button>
            </form>

            <p class="auth-foot"><a class="auth-link" href="login.html"><i class="bi bi-arrow-left" aria-hidden="true"></i>Back to log in</a></p>
        </div>
        <p class="auth-note">Form checks only help you fix typos. No email is sent from this page yet.</p>
    </main>

    <script src="../../assets/js/core/theme-toggle.js"></script>
    <script type="module" src="../../assets/js/modules/auth.js"></script>
</body>
</html>
